<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Banderillas Coreanas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .glass-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans h-screen overflow-hidden flex flex-col">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const COLUMNS = [
      { id: 'pending', title: '🟡 Nuevos Pedidos', bgColor: 'bg-yellow-500/10', borderColor: 'border-yellow-500/30' },
      { id: 'preparing', title: '🍳 En Preparación', bgColor: 'bg-orange-500/10', borderColor: 'border-orange-500/30' },
      { id: 'shipping', title: '🛵 En Camino / Listo', bgColor: 'bg-blue-500/10', borderColor: 'border-blue-500/30' },
      { id: 'completed', title: '✅ Entregados', bgColor: 'bg-emerald-500/10', borderColor: 'border-emerald-500/30' }
    ];

    function App() {
      const [orders, setOrders] = useState([]);
      const [soundEnabled, setSoundEnabled] = useState(false);

      // Cargar órdenes y escuchar cambios en tiempo real desde la otra pestaña
      useEffect(() => {
        const loadOrders = () => {
          const stored = localStorage.getItem('banderillas_orders');
          if (stored) {
            const parsedOrders = JSON.parse(stored);
            if (parsedOrders.length > orders.length && soundEnabled) {
               playNotification();
            }
            setOrders(parsedOrders);
          }
        };

        loadOrders();
        window.addEventListener('storage', loadOrders);
        const interval = setInterval(loadOrders, 2000);
        return () => {
          window.removeEventListener('storage', loadOrders);
          clearInterval(interval);
        };
      }, [orders.length, soundEnabled]);

      const playNotification = () => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } catch (e) {}
      };

      // Función para enviar mensaje por WhatsApp al cliente
      const sendWhatsAppStatusUpdate = (order, newStatus) => {
        if (!order.phone) return;

        // Limpia el número quitando cualquier carácter no numérico
        let cleanPhone = order.phone.replace(/\D/g, '');
        
        // Asume lada de México (52) si no la tiene incluida
        if (cleanPhone.length === 10) {
          cleanPhone = '52' + cleanPhone;
        }

        let message = "";
        const orderNum = order.id.toString().slice(-4);

        switch (newStatus) {
          case 'preparing':
            message = `🍳 *¡Hola ${order.customer}!*\n\nTu pedido *#${orderNum}* de *Banderillas Coreanas* ha sido aceptado y ya se encuentra *En Preparación*. 🔥\n\n¡Te avisaremos en cuanto salga!`;
            break;
          case 'shipping':
            message = order.deliveryType === 'delivery'
              ? `🛵 *¡Buenas noticias, ${order.customer}!*\n\nTu pedido *#${orderNum}* ya va *En Camino* a tu dirección (${order.address}). 📍\n\n¡El repartidor llegará pronto!`
              : `🏪 *¡Hola ${order.customer}!*\n\nTu pedido *#${orderNum}* ya está *Listo para Recoger* en sucursal. 🌭\n\n¡Te esperamos!`;
            break;
          case 'completed':
            message = `✅ *¡Pedido Entregado!*\n\nMuchas gracias por tu compra en *Banderillas Coreanas*, ${order.customer}. Esperamos que lo disfrutes mucho. 🌭🔥🧀\n\n¡Nos encantaría volver a atenderte pronto!`;
            break;
          default:
            return;
        }

        const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
      };

      const updateOrderStatus = (orderId, newStatus) => {
        const targetOrder = orders.find(o => o.id === orderId);
        const updatedOrders = orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o);
        
        setOrders(updatedOrders);
        localStorage.setItem('banderillas_orders', JSON.stringify(updatedOrders));

        // Activa la actualización por WhatsApp
        if (targetOrder) {
          sendWhatsAppStatusUpdate(targetOrder, newStatus);
        }
      };

      const deleteOrder = (orderId) => {
        if(window.confirm('¿Seguro que deseas eliminar este pedido del historial?')) {
          const updatedOrders = orders.filter(o => o.id !== orderId);
          setOrders(updatedOrders);
          localStorage.setItem('banderillas_orders', JSON.stringify(updatedOrders));
        }
      };

      const clearCompleted = () => {
        if(window.confirm('¿Limpiar todos los pedidos entregados?')) {
          const updatedOrders = orders.filter(o => o.status !== 'completed');
          setOrders(updatedOrders);
          localStorage.setItem('banderillas_orders', JSON.stringify(updatedOrders));
        }
      };

      // Estadísticas
      const totalSales = orders.filter(o => o.status === 'completed').reduce((sum, o) => sum + o.total, 0);
      const pendingCount = orders.filter(o => o.status === 'pending').length;

      return (
        <div className="h-full flex flex-col">
          {/* Header */}
          <header className="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shrink-0">
            <div className="flex items-center gap-4">
              <h1 className="text-xl font-black text-orange-500 tracking-wider">🔥 BANDERILLAS COREANAS <span className="text-white">ADMIN</span></h1>
              <button 
                onClick={() => { setSoundEnabled(!soundEnabled); if(!soundEnabled) playNotification(); }}
                className={`text-xs px-3 py-1 rounded-full border ${soundEnabled ? 'border-emerald-500 text-emerald-400 bg-emerald-500/10' : 'border-slate-600 text-slate-400'}`}
              >
                {soundEnabled ? '🔊 Sonido Activado' : '🔇 Activar Sonido'}
              </button>
            </div>
            <div className="flex gap-4">
              <div className="text-right">
                <span className="text-xs text-slate-400 block uppercase">Nuevos Hoy</span>
                <span className="text-lg font-bold text-yellow-400">{pendingCount} pedidos</span>
              </div>
              <div className="text-right border-l border-slate-700 pl-4">
                <span className="text-xs text-slate-400 block uppercase">Ventas (Completadas)</span>
                <span className="text-lg font-bold text-emerald-400">${totalSales} MXN</span>
              </div>
            </div>
          </header>

          {/* Tablero Kanban */}
          <div className="flex-1 overflow-x-auto p-4 flex gap-4 no-scrollbar items-stretch">
            {COLUMNS.map(col => {
              const colOrders = orders.filter(o => o.status === col.id).sort((a, b) => b.id - a.id);
              return (
                <div key={col.id} className={`w-80 flex-shrink-0 flex flex-col rounded-2xl border ${col.borderColor} ${col.bgColor} overflow-hidden`}>
                  <div className="p-3 border-b border-white/10 bg-black/20 flex justify-between items-center">
                    <h2 className="font-bold text-sm">{col.title}</h2>
                    <span className="bg-slate-800 text-xs px-2 py-0.5 rounded-full">{colOrders.length}</span>
                  </div>
                  
                  <div className="flex-1 overflow-y-auto p-3 space-y-3 no-scrollbar">
                    {colOrders.length === 0 ? (
                      <p className="text-xs text-slate-500 text-center py-4">Sin pedidos aquí</p>
                    ) : (
                      colOrders.map(order => (
                        <div key={order.id} className="glass-panel p-3 rounded-xl shadow-lg relative group">
                          <button onClick={() => deleteOrder(order.id)} className="absolute top-2 right-2 text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">✕</button>
                          
                          <div className="flex justify-between items-start mb-2 border-b border-white/10 pb-2">
                            <div>
                              <span className="text-xs text-slate-400">#{order.id.toString().slice(-4)} - {new Date(order.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                              <h3 className="font-bold text-white text-sm">{order.customer}</h3>
                              <a href={`tel:${order.phone}`} className="text-xs text-orange-400 hover:underline">📞 {order.phone}</a>
                            </div>
                            <span className="font-black text-emerald-400">${order.total}</span>
                          </div>

                          <div className="mb-2">
                            <span className="text-[10px] uppercase font-bold text-slate-400 bg-slate-900 px-2 py-0.5 rounded">
                              {order.deliveryType === 'delivery' ? '🛵 A Domicilio' : '🏪 Recoger'}
                            </span>
                            {order.deliveryType === 'delivery' && (
                              <p className="text-xs text-slate-300 mt-1 truncate">📍 {order.address}</p>
                            )}
                          </div>

                          <div className="bg-slate-900/50 p-2 rounded-lg mb-3 space-y-2">
                            {order.cart.map((item, i) => (
                              <div key={i} className="text-xs border-b border-white/5 last:border-0 pb-1">
                                <span className="font-bold text-orange-300">Orden {i+1}: {item.base}</span>
                                <ul className="pl-2 list-disc list-inside text-slate-300 text-[10px]">
                                  {item.coatings.map((c, ci) => <li key={ci}>{c.name}</li>)}
                                </ul>
                                <span className="text-[10px] text-slate-400 block mt-0.5">Salsas: {item.sauces}</span>
                                {item.drink && <span className="text-[10px] text-amber-400 block">🥤 {item.drink}</span>}
                              </div>
                            ))}
                          </div>

                          {/* Botones de Acción que avanzan el estado y abren WhatsApp */}
                          <div className="flex gap-2">
                            {col.id === 'pending' && (
                              <button onClick={() => updateOrderStatus(order.id, 'preparing')} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1">
                                <span>Aceptar y Avisar</span> 💬
                              </button>
                            )}
                            {col.id === 'preparing' && (
                              <button onClick={() => updateOrderStatus(order.id, 'shipping')} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1">
                                <span>Enviar / Avisar</span> 💬
                              </button>
                            )}
                            {col.id === 'shipping' && (
                              <button onClick={() => updateOrderStatus(order.id, 'completed')} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1">
                                <span>Entregado y Avisar</span> ✅
                              </button>
                            )}
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                  
                  {col.id === 'completed' && colOrders.length > 0 && (
                    <div className="p-2 bg-black/20 border-t border-white/10">
                      <button onClick={clearCompleted} className="w-full text-xs text-slate-400 hover:text-white py-1">Limpiar Entregados</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
