<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Banderillas Coreanas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .glass-panel {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans h-[100dvh] overflow-hidden flex flex-col">
  <div id="root" class="h-full"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAuL5YKxucoHUKCkoz5j6m9KU1XjTP0Z2o",
      authDomain: "banderillascoreanas-f9e60.firebaseapp.com",
      databaseURL: "https://banderillascoreanas-f9e60-default-rtdb.firebaseio.com",
      projectId: "banderillascoreanas-f9e60",
      storageBucket: "banderillascoreanas-f9e60.firebasestorage.app",
      messagingSenderId: "30789485951",
      appId: "1:30789485951:web:bb31aec060f17ad6ea864a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    window.db = db;
    window.ref = ref;
    window.onValue = onValue;
    window.update = update;
    window.remove = remove;
    window.auth = auth;
    window.onAuthStateChanged = onAuthStateChanged;
    window.signInWithEmailAndPassword = signInWithEmailAndPassword;
    window.signOut = signOut;
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const COLUMNS = [
      { id: 'pending', title: '🟡 Nuevos Pedidos', bgColor: 'bg-yellow-500/10', borderColor: 'border-yellow-500/30' },
      { id: 'preparing', title: '🍳 En Preparación', bgColor: 'bg-orange-500/10', borderColor: 'border-orange-500/30' },
      { id: 'shipping', title: '🛵 En Camino / Listo', bgColor: 'bg-blue-500/10', borderColor: 'border-blue-500/30' },
      { id: 'completed', title: '✅ Entregados', bgColor: 'bg-emerald-500/10', borderColor: 'border-emerald-500/30' }
    ];

    function LoginScreen() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        setError('');
        if (!email.trim() || !password) {
          setError('Ingresa tu correo y contraseña.');
          return;
        }
        setLoading(true);
        try {
          await window.signInWithEmailAndPassword(window.auth, email.trim(), password);
        } catch (err) {
          setError('Correo o contraseña incorrectos.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="h-full w-full flex items-center justify-center bg-slate-950 p-4">
          <form onSubmit={handleLogin} className="glass-panel p-6 sm:p-8 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
            <h1 className="text-lg sm:text-xl font-black text-orange-500 text-center tracking-wide">🔥 BANDERILLAS COREANAS <span className="text-white block text-sm font-bold mt-1">Acceso Admin</span></h1>
            <div>
              <label className="text-xs font-bold text-slate-300 block mb-1">Correo</label>
              <input
                type="email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500"
                placeholder="admin@tucorreo.com"
                autoFocus
              />
            </div>
            <div>
              <label className="text-xs font-bold text-slate-300 block mb-1">Contraseña</label>
              <input
                type="password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500"
                placeholder="••••••••"
              />
            </div>
            {error && <p className="text-xs text-red-400">{error}</p>}
            <button
              type="submit"
              disabled={loading}
              className="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 disabled:opacity-50 text-white font-extrabold py-2.5 rounded-lg transition"
            >
              {loading ? 'Entrando...' : 'Entrar'}
            </button>
          </form>
        </div>
      );
    }

    function AuthGate() {
      const [user, setUser] = useState(undefined); // undefined = cargando, null = sin sesión

      useEffect(() => {
        const checkAuth = setInterval(() => {
          if (window.auth && window.onAuthStateChanged) {
            clearInterval(checkAuth);
            window.onAuthStateChanged(window.auth, (u) => setUser(u || null));
          }
        }, 300);
        return () => clearInterval(checkAuth);
      }, []);

      if (user === undefined) {
        return <div className="h-full w-full flex items-center justify-center bg-slate-950 text-slate-400 text-sm">Cargando...</div>;
      }
      if (user === null) {
        return <LoginScreen />;
      }
      return <App />;
    }

    function App() {
      const [orders, setOrders] = useState([]);
      const [historyOrders, setHistoryOrders] = useState([]);
      const [soundEnabled, setSoundEnabled] = useState(() => {
        const saved = localStorage.getItem('banderillas_sound_enabled');
        return saved === null ? true : saved === 'true';
      });
      const [showReports, setShowReports] = useState(false);
      const prevOrderCount = useRef(0);
      const soundEnabledRef = useRef(soundEnabled);
      const audioCtxRef = useRef(null);
      const firstOrdersLoad = useRef(true);
      const [hasNewOrder, setHasNewOrder] = useState(false);
      const originalTitleRef = useRef(document.title);

      useEffect(() => {
        soundEnabledRef.current = soundEnabled;
        localStorage.setItem('banderillas_sound_enabled', soundEnabled);
      }, [soundEnabled]);

      const getAudioCtx = () => {
        if (!audioCtxRef.current) {
          audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioCtxRef.current;
      };

      // Desbloquea el audio con el primer toque/clic en la pantalla: los navegadores
      // no dejan sonar nada si nunca hubo una interacción del usuario en la página.
      useEffect(() => {
        const unlockAudio = () => {
          const ctx = getAudioCtx();
          if (ctx.state === 'suspended') ctx.resume();
        };
        document.addEventListener('click', unlockAudio);
        document.addEventListener('touchstart', unlockAudio);
        return () => {
          document.removeEventListener('click', unlockAudio);
          document.removeEventListener('touchstart', unlockAudio);
        };
      }, []);

      // Reactiva el audio al volver a esta pestaña: algunos navegadores (sobre todo
      // en celular) lo suspenden solos cuando la pantalla se apaga o se minimiza.
      useEffect(() => {
        const onVisible = () => {
          if (document.visibilityState === 'visible' && audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
            audioCtxRef.current.resume();
          }
        };
        document.addEventListener('visibilitychange', onVisible);
        return () => document.removeEventListener('visibilitychange', onVisible);
      }, []);

      // Hace parpadear el título de la pestaña del navegador mientras haya un
      // pedido nuevo sin revisar, como respaldo visual si el sonido no se oye.
      useEffect(() => {
        if (!hasNewOrder) {
          document.title = originalTitleRef.current;
          return;
        }
        let flashOn = false;
        document.title = '🔔 ¡Nuevo pedido!';
        const flashInterval = setInterval(() => {
          flashOn = !flashOn;
          document.title = flashOn ? originalTitleRef.current : '🔔 ¡Nuevo pedido!';
        }, 1000);
        return () => {
          clearInterval(flashInterval);
          document.title = originalTitleRef.current;
        };
      }, [hasNewOrder]);

      useEffect(() => {
        const checkFirebase = setInterval(() => {
          if (window.db && window.ref && window.onValue) {
            clearInterval(checkFirebase);
            const ordersRef = window.ref(window.db, 'pedidos');
            const historyRef = window.ref(window.db, 'pedidos_historial');

            window.onValue(ordersRef, (snapshot) => {
              const data = snapshot.val();
              if (data) {
                const loadedOrders = Object.keys(data).map(key => ({
                  firebaseKey: key,
                  ...data[key]
                }));

                if (loadedOrders.length > prevOrderCount.current && !firstOrdersLoad.current) {
                  if (soundEnabledRef.current) playNotification();
                  setHasNewOrder(true);
                }
                firstOrdersLoad.current = false;
                prevOrderCount.current = loadedOrders.length;
                setOrders(loadedOrders);
              } else {
                setOrders([]);
                prevOrderCount.current = 0;
                firstOrdersLoad.current = false;
              }
            });

            window.onValue(historyRef, (snapshot) => {
              const data = snapshot.val();
              if (data) {
                setHistoryOrders(Object.keys(data).map(key => ({ firebaseKey: key, ...data[key] })));
              } else {
                setHistoryOrders([]);
              }
            });
          }
        }, 300);

        return () => clearInterval(checkFirebase);
      }, []);

      const playNotification = () => {
        try {
          const ctx = getAudioCtx();
          const fire = () => {
            [0, 0.4].forEach((delay) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.type = 'sine';
              osc.frequency.setValueAtTime(880, ctx.currentTime + delay);
              osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + delay + 0.3);
              gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
              gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + delay + 0.3);
              osc.start(ctx.currentTime + delay);
              osc.stop(ctx.currentTime + delay + 0.3);
            });
          };
          if (ctx.state === 'suspended') {
            ctx.resume().then(fire);
          } else {
            fire();
          }
        } catch (e) {}
      };

      const sendWhatsAppStatusUpdate = (order, newStatus) => {
        if (!order.phone) return;

        let cleanPhone = order.phone.replace(/\D/g, '');
        if (cleanPhone.length === 10) {
          cleanPhone = '52' + cleanPhone;
        }

        let message = "";
        const orderNum = order.orderNumber ? order.orderNumber : (order.id ? order.id.toString().slice(-4) : "0000");

        switch (newStatus) {
          case 'preparing':
            message = `🍳 *¡Hola ${order.customer}!*\n\nTu pedido *#${orderNum}* de *Banderillas Coreanas* ha sido aceptado y ya se encuentra *En Preparación*. 🔥\n\n¡Te avisaremos en cuanto salga!`;
            break;
          case 'shipping':
            message = order.deliveryType === 'delivery'
              ? `🛵 *¡Buenas noticias, ${order.customer}!*\n\nTu pedido *#${orderNum}* ya va *En Camino* a tu dirección (${order.address}). 📍\n\n¡El repartidor llegará pronto!`
              : `🏪 *¡Hola ${order.customer}!*\n\nTu pedido *#${orderNum}* ya está *Listo para Recoger* en sucursal. 🌭\n\n¡Te esperamos!`;
            break;
          case 'completed':
            message = `✅ *¡Pedido Entregado!*\n\nMuchas gracias por tu compra en *Banderillas Coreanas*, ${order.customer}. Esperamos que lo disfrutes mucho. 🌭🔥🧀\n\n¡Nos encantaría volver a atenderte pronto!`;
            break;
          default:
            return;
        }

        const url = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
      };

      const updateOrderStatus = (order, newStatus) => {
        if (window.db && window.ref && window.update && order.firebaseKey) {
          const orderRef = window.ref(window.db, `pedidos/${order.firebaseKey}`);
          window.update(orderRef, { status: newStatus });
          sendWhatsAppStatusUpdate(order, newStatus);
        }
        setHasNewOrder(false);
      };

      const deleteOrder = (firebaseKey) => {
        if (window.confirm('¿Seguro que deseas eliminar este pedido del historial?')) {
          if (window.db && window.ref && window.remove && firebaseKey) {
            const orderRef = window.ref(window.db, `pedidos/${firebaseKey}`);
            window.remove(orderRef);
          }
        }
      };

      const clearCompleted = () => {
        if (window.confirm('¿Archivar todos los pedidos entregados? Se moverán al historial y podrás verlos luego en Reportes.')) {
          const completedOrders = orders.filter(o => o.status === 'completed');
          if (completedOrders.length === 0 || !window.db || !window.ref || !window.update) return;

          const updates = {};
          completedOrders.forEach(o => {
            if (o.firebaseKey) {
              const { firebaseKey, ...orderData } = o;
              updates[`pedidos_historial/${firebaseKey}`] = { ...orderData, archivedAt: new Date().toISOString() };
              updates[`pedidos/${firebaseKey}`] = null;
            }
          });
          window.update(window.ref(window.db), updates);
        }
      };

      const resetReport = () => {
        if (window.confirm('¿Reiniciar el reporte de ventas? Esto borrará permanentemente todo el historial archivado (pedidos_historial) que alimenta los totales de Hoy/Semana/Mes y el ranking de más pedidos. No borra los pedidos activos del tablero. Esta acción no se puede deshacer.')) {
          if (window.db && window.ref && window.remove) {
            window.remove(window.ref(window.db, 'pedidos_historial'));
          }
        }
      };

      const resetOrderCounter = () => {
        if (window.confirm('¿Reiniciar la numeración de pedidos? El próximo pedido que se cree empezará en #1 de nuevo. Esto no borra ni modifica los pedidos ya existentes, solo el contador para los pedidos nuevos.')) {
          if (window.db && window.ref && window.update) {
            window.update(window.ref(window.db), { 'contador/pedidos': 0 });
          }
        }
      };

      const totalSales = orders.filter(o => o.status === 'completed').reduce((sum, o) => sum + (o.total || 0), 0);
      const pendingCount = orders.filter(o => o.status === 'pending').length;

      // --- Reportes: ventas por periodo y combos/empanizados más pedidos ---
      const allSales = useMemo(() => [...orders.filter(o => o.status === 'completed'), ...historyOrders], [orders, historyOrders]);

      const salesReport = useMemo(() => {
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const dayOfWeek = (now.getDay() + 6) % 7; // lunes = 0
        const startOfWeek = new Date(startOfToday);
        startOfWeek.setDate(startOfToday.getDate() - dayOfWeek);
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

        let hoy = 0, semana = 0, mes = 0;
        const baseCounts = {};
        const coatingCounts = {};

        allSales.forEach(o => {
          const t = o.timestamp ? new Date(o.timestamp) : null;
          const total = o.total || 0;
          if (t) {
            if (t >= startOfToday) hoy += total;
            if (t >= startOfWeek) semana += total;
            if (t >= startOfMonth) mes += total;
          }
          (o.cart || []).forEach(item => {
            if (item.base) baseCounts[item.base] = (baseCounts[item.base] || 0) + 1;
            (item.coatings || []).forEach(c => {
              const name = c && c.name ? c.name : null;
              if (name) coatingCounts[name] = (coatingCounts[name] || 0) + 1;
            });
          });
        });

        const topBases = Object.entries(baseCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
        const topCoatings = Object.entries(coatingCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);

        return { hoy, semana, mes, topBases, topCoatings, totalOrdenes: allSales.length };
      }, [allSales]);

      return (
        <div className="h-full flex flex-col">
          {hasNewOrder && (
            <div
              onClick={() => setHasNewOrder(false)}
              className="bg-red-600 text-white text-center text-xs sm:text-sm font-bold py-2 px-3 cursor-pointer shrink-0 animate-pulse"
            >
              🔔 ¡Tienes un pedido nuevo! Toca aquí para quitar el aviso
            </div>
          )}
          <header className="bg-slate-900 border-b border-slate-800 p-3 md:p-4 flex flex-col md:flex-row md:justify-between md:items-center gap-2.5 shrink-0">
            <div className="flex items-center justify-between md:justify-start gap-3 flex-wrap">
              <h1 className="text-sm sm:text-base md:text-xl font-black text-orange-500 tracking-wider leading-tight">🔥 BANDERILLAS <span className="hidden sm:inline">COREANAS </span><span className="text-white">ADMIN</span></h1>
              <button 
                onClick={() => { setSoundEnabled(!soundEnabled); if(!soundEnabled) playNotification(); }}
                className={`text-[10px] sm:text-xs px-2.5 sm:px-3 py-1 rounded-full border whitespace-nowrap ${soundEnabled ? 'border-emerald-500 text-emerald-400 bg-emerald-500/10' : 'border-slate-600 text-slate-400'}`}
              >
                {soundEnabled ? '🔊 Sonido' : '🔇 Sonido'}
              </button>
            </div>
            <div className="flex flex-wrap items-center justify-between md:justify-end gap-2.5 md:gap-4">
              <div className="text-left md:text-right">
                <span className="text-[10px] text-slate-400 block uppercase">Nuevos Hoy</span>
                <span className="text-sm sm:text-base md:text-lg font-bold text-yellow-400">{pendingCount} pedidos</span>
              </div>
              <div className="text-left md:text-right md:border-l border-slate-700 md:pl-4">
                <span className="text-[10px] text-slate-400 block uppercase">Ventas</span>
                <span className="text-sm sm:text-base md:text-lg font-bold text-emerald-400">${totalSales} MXN</span>
              </div>
              <button
                onClick={() => setShowReports(true)}
                className="text-[10px] sm:text-xs px-2.5 sm:px-3 py-1.5 rounded-full border border-slate-600 text-slate-300 hover:border-orange-500 hover:text-orange-400 transition whitespace-nowrap"
              >
                📊 Reportes
              </button>
              <button
                onClick={() => window.signOut(window.auth)}
                className="text-[10px] sm:text-xs px-2.5 sm:px-3 py-1.5 rounded-full border border-slate-600 text-slate-400 hover:border-red-500 hover:text-red-400 transition whitespace-nowrap"
              >
                🚪 Salir
              </button>
            </div>
          </header>

          {showReports && (
            <ReportsModal
              report={salesReport}
              onClose={() => setShowReports(false)}
              onResetReport={resetReport}
              onResetCounter={resetOrderCounter}
            />
          )}

          <div className="flex-1 overflow-x-auto p-3 md:p-4 flex gap-3 md:gap-4 no-scrollbar items-stretch snap-x snap-mandatory">
            {COLUMNS.map(col => {
              const colOrders = orders.filter(o => o.status === col.id).sort((a, b) => b.id - a.id);
              return (
                <div key={col.id} className={`w-[88vw] max-w-[320px] sm:w-80 flex-shrink-0 flex flex-col rounded-2xl border ${col.borderColor} ${col.bgColor} overflow-hidden snap-center`}>
                  <div className="p-3 border-b border-white/10 bg-black/20 flex justify-between items-center">
                    <h2 className="font-bold text-sm">{col.title}</h2>
                    <span className="bg-slate-800 text-xs px-2 py-0.5 rounded-full">{colOrders.length}</span>
                  </div>
                  
                  <div className="flex-1 overflow-y-auto p-3 space-y-3 no-scrollbar">
                    {colOrders.length === 0 ? (
                      <p className="text-xs text-slate-500 text-center py-4">Sin pedidos aquí</p>
                    ) : (
                      colOrders.map(order => (
                        <div key={order.firebaseKey || order.id} className="glass-panel p-3 rounded-xl shadow-lg relative group">
                          <button onClick={() => deleteOrder(order.firebaseKey)} className="absolute top-2 right-2 text-red-500 opacity-60 md:opacity-0 md:group-hover:opacity-100 transition-opacity text-sm p-1">✕</button>
                          
                          <div className="flex justify-between items-start mb-2 border-b border-white/10 pb-2">
                            <div>
                              <span className="text-xs text-slate-400">#{order.orderNumber ? order.orderNumber : (order.id ? order.id.toString().slice(-4) : "----")} - {order.timestamp ? new Date(order.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : ""}</span>
                              <h3 className="font-bold text-white text-sm">{order.customer}</h3>
                              <a href={`tel:${order.phone}`} className="text-xs text-orange-400 hover:underline">📞 {order.phone}</a>
                              {order.popupBlocked && (
                                <span className="block mt-1 text-[10px] font-bold text-red-400 bg-red-500/10 border border-red-500/30 px-1.5 py-0.5 rounded w-fit">
                                  ⚠️ Posible WhatsApp no enviado - confirma por llamada
                                </span>
                              )}
                            </div>
                            <span className="font-black text-emerald-400">${order.total}</span>
                          </div>

                          <div className="mb-2">
                            <span className="text-[10px] uppercase font-bold text-slate-400 bg-slate-900 px-2 py-0.5 rounded">
                              {order.deliveryType === 'delivery' ? '🛵 A Domicilio' : '🏪 Recoger'}
                            </span>
                            {order.deliveryType === 'delivery' && (
                              <p className="text-xs text-slate-300 mt-1 truncate">📍 {order.address}</p>
                            )}
                          </div>

                          <div className="bg-slate-900/50 p-2 rounded-lg mb-3 space-y-2">
                            {order.cart && order.cart.map((item, i) => (
                              <div key={i} className="text-xs border-b border-white/5 last:border-0 pb-1">
                                <span className="font-bold text-orange-300">Orden {i+1}: {item.base}</span>
                                <ul className="pl-2 list-disc list-inside text-slate-300 text-[10px]">
                                  {item.coatings && item.coatings.map((c, ci) => <li key={ci}>{c.name}</li>)}
                                </ul>

                                <div className="mt-1">
                                  <span className="text-[10px] text-slate-400 block font-semibold">Salsas:</span>
                                  {Array.isArray(item.sauces) ? (
                                    item.sauces.length > 0 ? (
                                      <div className="flex flex-wrap gap-1 mt-0.5">
                                        {item.sauces.map((s, idx) => (
                                          <span key={s.id || idx} className="bg-amber-500/10 text-amber-300 border border-amber-500/20 px-1.5 py-0.5 rounded text-[9px]">
                                            {typeof s === 'object' ? s.name : s}
                                          </span>
                                        ))}
                                      </div>
                                    ) : (
                                      <span className="text-[10px] text-slate-500 italic">Sin salsas</span>
                                    )
                                  ) : (
                                    <span className="text-[10px] text-slate-300">{item.sauces}</span>
                                  )}
                                </div>

                                {item.drink && <span className="text-[10px] text-amber-400 block mt-1">🥤 {item.drink}</span>}
                              </div>
                            ))}
                          </div>

                          <div className="flex gap-2">
                            {col.id === 'pending' && (
                              <button onClick={() => updateOrderStatus(order, 'preparing')} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1">
                                <span>Aceptar y Avisar</span> 💬
                              </button>
                            )}
                            {col.id === 'preparing' && (
                              <button onClick={() => updateOrderStatus(order, 'shipping')} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1">
                                <span>Enviar / Avisar</span> 💬
                              </button>
                            )}
                            {col.id === 'shipping' && (
                              <button onClick={() => updateOrderStatus(order, 'completed')} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1">
                                <span>Entregado y Avisar</span> ✅
                              </button>
                            )}
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                  
                  {col.id === 'completed' && colOrders.length > 0 && (
                    <div className="p-2 bg-black/20 border-t border-white/10">
                      <button onClick={clearCompleted} className="w-full text-xs text-slate-400 hover:text-white py-1">📦 Archivar Entregados</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }
    function ReportsModal({ report, onClose, onResetReport, onResetCounter }) {
      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-3 sm:p-4" onClick={onClose}>
          <div className="glass-panel w-full max-w-lg rounded-2xl p-4 sm:p-5 shadow-2xl max-h-[85vh] overflow-y-auto no-scrollbar" onClick={(e) => e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4 border-b border-white/10 pb-2">
              <h2 className="text-base sm:text-lg font-black text-orange-400">📊 Reportes de Ventas</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-xl font-bold">✕</button>
            </div>

            <div className="grid grid-cols-3 gap-1.5 sm:gap-2 mb-5">
              <div className="bg-slate-900/70 rounded-xl p-2 sm:p-3 text-center border border-slate-700">
                <span className="text-[9px] sm:text-[10px] uppercase text-slate-400 block">Hoy</span>
                <span className="text-sm sm:text-lg font-black text-emerald-400 break-words">${report.hoy}</span>
              </div>
              <div className="bg-slate-900/70 rounded-xl p-2 sm:p-3 text-center border border-slate-700">
                <span className="text-[9px] sm:text-[10px] uppercase text-slate-400 block">Semana</span>
                <span className="text-sm sm:text-lg font-black text-emerald-400 break-words">${report.semana}</span>
              </div>
              <div className="bg-slate-900/70 rounded-xl p-2 sm:p-3 text-center border border-slate-700">
                <span className="text-[9px] sm:text-[10px] uppercase text-slate-400 block">Mes</span>
                <span className="text-sm sm:text-lg font-black text-emerald-400 break-words">${report.mes}</span>
              </div>
            </div>

            <p className="text-xs text-slate-400 mb-4">Basado en {report.totalOrdenes} pedidos entregados (activos + archivados).</p>

            <div className="mb-5">
              <h3 className="text-sm font-bold text-orange-400 mb-2">🏆 Órdenes más pedidas</h3>
              {report.topBases.length === 0 ? (
                <p className="text-xs text-slate-500">Aún no hay suficientes datos.</p>
              ) : (
                <div className="space-y-1.5">
                  {report.topBases.map(([name, count], i) => (
                    <div key={name} className="flex justify-between items-center bg-slate-900/50 px-3 py-1.5 rounded-lg border border-slate-800">
                      <span className="text-xs text-slate-200">{i + 1}. {name}</span>
                      <span className="text-xs font-bold text-orange-400">{count}x</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="mb-5">
              <h3 className="text-sm font-bold text-orange-400 mb-2">🧀 Empanizados favoritos</h3>
              {report.topCoatings.length === 0 ? (
                <p className="text-xs text-slate-500">Aún no hay suficientes datos.</p>
              ) : (
                <div className="space-y-1.5">
                  {report.topCoatings.map(([name, count], i) => (
                    <div key={name} className="flex justify-between items-center bg-slate-900/50 px-3 py-1.5 rounded-lg border border-slate-800">
                      <span className="text-xs text-slate-200">{i + 1}. {name}</span>
                      <span className="text-xs font-bold text-orange-400">{count}x</span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="border-t border-white/10 pt-3 space-y-2">
              <h3 className="text-xs font-bold text-red-400 uppercase tracking-wide mb-1">⚠️ Zona de reinicio</h3>
              <button
                onClick={onResetReport}
                className="w-full text-xs font-semibold text-slate-300 hover:text-white bg-slate-900/70 hover:bg-red-950/40 border border-slate-700 hover:border-red-500/50 py-2 rounded-lg transition"
              >
                🔄 Reiniciar Reporte de Ventas
              </button>
              <button
                onClick={onResetCounter}
                className="w-full text-xs font-semibold text-slate-300 hover:text-white bg-slate-900/70 hover:bg-red-950/40 border border-slate-700 hover:border-red-500/50 py-2 rounded-lg transition"
              >
                🔢 Reiniciar Numeración de Pedidos (próximo = #1)
              </button>
              <p className="text-[10px] text-slate-500 leading-relaxed">
                Reiniciar el reporte borra el historial archivado usado para estas estadísticas. Reiniciar la numeración solo afecta a los próximos pedidos nuevos.
              </p>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate />);
  </script>
</body>
</html>
