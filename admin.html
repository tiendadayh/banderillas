  <script>
    (function () {
      var indicator = document.getElementById('ptr-indicator');
      var spinner = document.getElementById('ptr-spinner');
      var THRESHOLD = 70;
      var MAX_PULL = 110;
      var startY = 0;
      var currentPull = 0;
      var pulling = false;
      var refreshing = false;

      function isInsideOverlay(el) {
        while (el && el !== document.body) {
          var cls = el.className && el.className.baseVal !== undefined ? el.className.baseVal : el.className;
          if (typeof cls === 'string' && cls.indexOf('fixed') !== -1 && cls.indexOf('inset-0') !== -1) {
            return true;
          }
          el = el.parentElement;
        }
        return false;
      }

      function findScrollableAncestor(el) {
        while (el && el !== document.body) {
          var style = window.getComputedStyle(el);
          if ((style.overflowY === 'auto' || style.overflowY === 'scroll') && el.scrollHeight > el.clientHeight) {
            return el;
          }
          el = el.parentElement;
        }
        return null;
      }

      function getScrollTop(el) {
        return el ? el.scrollTop : (window.scrollY || document.documentElement.scrollTop);
      }

      function setPull(px) {
        currentPull = px;
        indicator.style.transform = 'translate(-50%, ' + (px - 60) + 'px)';

        spinner.style.transform = 'rotate(' + (px * 3) + 'deg)';
      }

        if (refreshing) return;
        var target = e.touches[0].target;
