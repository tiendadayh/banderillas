<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Banderillas Coreanas | Pide en Línea</title>
  <meta name="description" content="Personaliza y pide las mejores banderillas coreanas a domicilio. Elige tu base, empanizado, salsas y bebidas. ¡Haz tu pedido por WhatsApp!">
  <meta name="keywords" content="banderillas coreanas, comida coreana, snacks, empanizados, delivery, restaurante">
  <meta name="theme-color" content="#f97316">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Banderillas Coreanas | Personaliza tu Orden">
  <meta property="og:description" content="¡Arma tu combinación favorita de 3 banderillas coreanas y haz tu pedido a domicilio!">
  <meta property="og:image" content="portada.jpg">

  <!-- Fuentes para el Badge Custom -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.03); }
    }

    .glow-effect {
      animation: pulseGlow 4s infinite ease-in-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-pop {
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Estilos del Badge Neón Exacto de la Imagen */
    .badge-header {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 10px 28px;
      background-color: #0b0e14;
      border: 2px solid #ff5500;
      border-radius: 9999px;
      box-shadow: 0 0 15px rgba(255, 85, 0, 0.45), inset 0 0 8px rgba(255, 85, 0, 0.2);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .badge-header:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 25px rgba(255, 85, 0, 0.75), inset 0 0 12px rgba(255, 85, 0, 0.3);
      border-color: #ff6a00;
    }

    .badge-header .badge-icon {
      font-size: 1.4rem;
      line-height: 1;
      filter: drop-shadow(0 0 4px rgba(255, 85, 0, 0.5));
    }

    .badge-header .title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ff5500;
      text-shadow: 0 0 8px rgba(255, 85, 0, 0.4);
    }

    @media (min-width: 768px) {
      .badge-header {
        padding: 12px 36px;
      }
      .badge-header .title {
        font-size: 1.6rem;
      }
      .badge-header .badge-icon {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 font-sans selection:bg-orange-500 selection:text-white transition-colors duration-300 overflow-x-hidden">

  <!-- PORTADA / HERO SECTION -->
  <header class="relative overflow-hidden bg-gradient-to-b from-slate-900 via-slate-950 to-slate-950 border-b border-slate-800 py-12 md:py-20 px-6 md:px-12">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-[500px] h-[500px] bg-orange-500/10 rounded-full blur-3xl pointer-events-none glow-effect"></div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-10 items-center relative z-10">
      <div class="space-y-6 text-center md:text-left">
        
        <!-- BADGE RESTRUCTURADO COMO LA IMAGEN -->
        <div class="flex justify-center md:justify-start">
          <div class="badge-header">
            <span class="badge-icon">🌭</span>
            <span class="title">BANDERILLAS COREANAS</span>
            <span class="badge-icon">🔥</span>
          </div>
        </div>

        <h1 class="text-4xl md:text-6xl font-black text-white leading-tight">
          El Sabor Perfecto en <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-400">Cada Bocado</span>
        </h1>

        <p class="text-slate-300 text-sm md:text-base leading-relaxed max-w-lg mx-auto md:mx-0">
          ¡Elige tu combinación favorita y personaliza el empanizado de cada una de tus 3 banderillas!
        </p>

        <div class="bg-gradient-to-r from-amber-500/20 via-orange-500/20 to-amber-500/20 border border-amber-500/40 rounded-2xl p-3.5 max-w-lg shadow-lg">
          <p class="text-xs md:text-sm font-extrabold text-amber-300 flex items-center justify-center md:justify-start gap-2">
            <span>📌</span>
            <span>TODAS LAS ÓRDENES INCLUYEN 3 BANDERILLAS PERSONALIZABLES</span>
          </p>
        </div>

        <div class="flex flex-wrap justify-center md:justify-start gap-4 pt-2">
          <a href="#creador" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 active:scale-95 text-white font-extrabold px-6 py-3.5 rounded-2xl shadow-lg shadow-orange-500/20 transition-all transform text-sm flex items-center gap-2">
            <span>Armar mi Orden</span>
            <span>🌭</span>
          </a>
        </div>
      </div>

      <div class="relative flex justify-center">
        <div class="absolute -top-3 -right-3 z-20 bg-amber-400 text-slate-950 font-black text-xs px-3 py-1.5 rounded-full shadow-lg border border-amber-300 transform rotate-6">
          ⭐ ¡3 Banderillas x Orden!
        </div>

        <div class="relative group w-full max-w-md">
          <div class="absolute -inset-1 bg-gradient-to-r from-orange-500 to-amber-500 rounded-3xl blur opacity-30 group-hover:opacity-60 transition duration-500"></div>

          <img src="portada.jpg" alt="Portada Banderillas Coreanas"
            class="relative rounded-3xl border-2 border-slate-700 object-cover w-full h-72 md:h-96 shadow-2xl transition-transform duration-300 group-hover:scale-[1.01]"
            onerror="this.src='https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=80'" />
        </div>
      </div>
    </div>
  </header>

  <!-- CREADOR DE BANDERILLAS -->
  <div id="creador">
    <div id="root"></div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useReducer } = React;

    const PHONE_NUMBER = "527442411773";
    const OPEN_HOUR = 13;
    const CLOSE_HOUR = 20;

    const PLACEHOLDER_FOOD = "https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=400&q=80";
    const PLACEHOLDER_DRINK = "https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=400&q=80";

    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        } else if (type === 'add') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.16);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) { }
    };

    const bases = [
      { id: 'clasica', name: 'Orden Clásica (3 Salchicha)', price: 130, badge: '🌭 3 Banderillas', icon: '🌭' },
      { id: 'mixta', name: 'Orden Mixta (3 Salchicha + Queso)', price: 160, badge: '⚡🔥 Recomendado', icon: '⚡' },
      { id: 'queso', name: 'Orden Especial Queso (3 Puro Queso)', price: 180, badge: '🧀🤤 El Favorito', icon: '🧀' }
    ];

    const coatings = [
      { id: 'panko', name: 'Clásica (Panko)', price: 0, badge: '🔥 Crujiente', image: 'panko.jpg' },
      { id: 'cheetos', name: 'Cheetos de Queso', price: 0, badge: '🧀 Quesoso', image: 'cheetos.jpg' },
      { id: 'flamin', name: 'Cheetos Flamin’ Hot', price: 0, badge: '🔥 Picoso', image: 'flamin.jpg' },
      { id: 'takis', name: 'Takis Azules', price: 0, badge: '🔵 Picante', image: 'takis.jpg' },
      { id: 'papas', name: 'Papa', price: 0, badge: '🥔 Crujiente', image: 'papas.jpg' },
      { id: 'ramen', name: 'Ramen', price: 0, badge: '🍜 Tostado', image: 'ramen.jpg' },
      { id: 'jalapeno', name: 'Jalapeño', price: 0, badge: '🌶️ Especial', image: 'jalapeno.jpg' }
    ];

    const availableSauces = [
      { id: 'ketchup', name: 'Ketchup', image: 'ketchup.jpg' },
      { id: 'queso_amarillo', name: 'Queso Amarillo', image: 'queso.jpg' },
      { id: 'chile_vinagre', name: 'Chile en Vinagre', image: 'chile.jpg' }
    ];

    const drinks = [
      { id: 'boba', name: 'Coca Cola (355ml)', price: 40, image: 'coca.jpg' },
      { id: 'soda', name: 'Refresco de Lata (355ml)', price: 25, image: 'soda.jpg' },
      { id: 'agua', name: 'Agua de Horchata', price: 30, image: 'horchata.jpg' }
    ];

    const chefPresets = [
      { name: '🔥 Orden Flamin Fuego', baseId: 'mixta', coatingIds: ['flamin', 'flamin', 'flamin'], sauces: ['ketchup', 'queso_amarillo'], drinkId: 'agua' },
      { name: '🧀 Orden Suprema Queso', baseId: 'queso', coatingIds: ['cheetos', 'cheetos', 'cheetos'], sauces: ['queso_amarillo', 'ketchup'], drinkId: 'boba' },
      { name: '🔵 Orden Variada Crunch', baseId: 'mixta', coatingIds: ['takis', 'panko', 'flamin'], sauces: ['ketchup', 'chile_vinagre'], drinkId: 'soda' },
      { name: '🌭 Orden Clásica Panko', baseId: 'clasica', coatingIds: ['panko', 'panko', 'panko'], sauces: ['ketchup', 'chile_vinagre'], drinkId: 'soda' }
    ];

    function SafeImage({ src, alt, className, fallbackEmoji = "🌭", defaultFallbackUrl = PLACEHOLDER_FOOD }) {
      const [imgSrc, setImgSrc] = useState(src);
      const [errorCount, setErrorCount] = useState(0);

      useEffect(() => { 
        setImgSrc(src); 
        setErrorCount(0);
      }, [src]);

      const handleError = () => {
        if (errorCount === 0) {
          setImgSrc(defaultFallbackUrl);
          setErrorCount(1);
        } else {
          setErrorCount(2);
        }
      };

      if (errorCount >= 2 || !imgSrc) {
        return (
          <div className={`${className} bg-slate-800 flex items-center justify-center text-xl select-none border border-slate-700`}>
            <span>{fallbackEmoji}</span>
          </div>
        );
      }

      return <img src={imgSrc} alt={alt} className={className} onError={handleError} />;
    }

    function CoatingSelector({ activeSlot, coatings, selectedCoatings, onSelectSlot, onSelectCoating }) {
      return (
        <div className="mb-6">
          <h3 className="text-sm font-bold text-orange-400 mb-2.5 flex items-center gap-1.5">
            <span className="w-5 h-5 bg-orange-500/20 text-orange-400 rounded-full flex items-center justify-center text-xs border border-orange-500/40">2</span>
            Elige el Cubierto para cada Banderilla
          </h3>

          <div className="grid grid-cols-3 gap-2 mb-3">
            {[0, 1, 2].map((slotIdx) => {
              const isCurrentSlot = activeSlot === slotIdx;
              const coatingSelected = selectedCoatings[slotIdx];
              return (
                <button
                  key={slotIdx}
                  type="button"
                  aria-label={`Seleccionar banderilla ${slotIdx + 1}`}
                  onClick={() => onSelectSlot(slotIdx)}
                  className={`py-2 px-1 rounded-xl text-xs font-bold transition-all transform active:scale-95 flex flex-col items-center justify-center border ${
                    isCurrentSlot
                      ? 'bg-orange-500 text-white border-orange-400 shadow-md ring-2 ring-orange-500/50 scale-[1.02]'
                      : coatingSelected
                      ? 'bg-slate-800 text-orange-300 border-orange-500/40 hover:scale-[1.01]'
                      : 'bg-slate-900 text-slate-400 border-slate-800 hover:border-slate-700 hover:scale-[1.01]'
                  }`}
                >
                  <span className="text-xs opacity-90">Banderilla #{slotIdx + 1}</span>
                  <span className="truncate max-w-full text-xs font-extrabold">
                    {coatingSelected ? coatingSelected.name : 'Elegir'}
                  </span>
                </button>
              );
            })}
          </div>

          <div className="grid grid-cols-2 gap-2.5">
            {coatings.map(c => {
              const isSelectedInCurrentSlot = selectedCoatings[activeSlot]?.id === c.id;
              return (
                <button
                  key={c.id}
                  type="button"
                  aria-label={`Empanizado ${c.name}`}
                  onClick={() => onSelectCoating(c)}
                  className={`p-3 rounded-xl border text-left flex flex-col justify-between transition-all transform hover:scale-[1.02] active:scale-95 ${isSelectedInCurrentSlot
                    ? 'border-orange-500 bg-orange-500/20 text-white shadow-lg font-semibold ring-1 ring-orange-500/30'
                    : 'border-slate-800 bg-slate-900/60 text-slate-300 hover:border-slate-700'
                    }`}
                >
                  <div className="flex flex-col">
                    <span className="font-semibold text-xs text-slate-200">{c.name}</span>
                    <span className="text-xs text-orange-400/90 mt-0.5">{c.badge}</span>
                  </div>
                  <span className="text-xs font-bold text-emerald-400 mt-2">
                    {isSelectedInCurrentSlot ? '✓ Seleccionado' : 'Asignar a #' + (activeSlot + 1)}
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    function PresetList({ presets, onApply }) {
      return (
        <div className="mb-6">
          <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2.5">Recetas Recomendadas</h3>
          <div className="flex flex-wrap gap-2">
            {presets.map((preset, idx) => (
              <button
                key={idx}
                type="button"
                aria-label={`Cargar receta ${preset.name}`}
                onClick={() => onApply(preset)}
                className="bg-slate-900 hover:bg-slate-800 active:scale-95 text-slate-200 border border-slate-700 text-xs px-3 py-1.5 rounded-xl transition-all transform font-medium flex items-center gap-1 shadow-sm"
              >
                {preset.name}
              </button>
            ))}
          </div>
        </div>
      );
    }

    function CartModal({
      isOpen,
      cart,
      storeOpen,
      deliveryType,
      customerName,
      customerPhone,
      deliveryAddress,
      paymentMethod,
      validationErrors,
      onClose,
      onRemoveItem,
      onCheckout,
      setCustomerName,
      setCustomerPhone,
      setDeliveryAddress,
      setPaymentMethod,
      setDeliveryType
    }) {
      if (!isOpen) return null;

      const totalCartPrice = cart.reduce((a, b) => a + b.price, 0);

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex justify-end z-50 animate-pop">
          <div className="bg-slate-900 w-full max-w-md h-full max-h-screen p-5 flex flex-col justify-between border-l border-slate-800 shadow-2xl overflow-hidden">

            <div className="flex-shrink-0 flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
              <div className="flex items-center gap-2">
                <h3 className="text-xl font-black text-white">Tu Pedido Detallado</h3>
                <span className="bg-orange-500 text-white font-bold text-xs px-2.5 py-0.5 rounded-full">{cart.length}</span>
              </div>
              <button type="button" aria-label="Cerrar carrito" onClick={onClose} className="text-slate-400 hover:text-white text-xl font-bold p-1">✕</button>
            </div>

            <div className="flex-1 overflow-y-auto pr-1 space-y-4 min-h-0">
              <div className="bg-slate-800/90 border border-amber-500/40 p-3 rounded-2xl flex items-center gap-3">
                <span className="text-2xl">⏱️</span>
                <div>
                  <span className="text-xs font-bold text-amber-400 block uppercase tracking-wide">Tiempo Estimado</span>
                  <span className="text-sm font-black text-white">
                    {deliveryType === 'delivery' ? '30 - 45 Minutos 🛵' : '15 - 20 Minutos 🏪'}
                  </span>
                </div>
              </div>

              <div className="space-y-4">
                {cart.length === 0 ? (
                  <p className="text-slate-300 text-center py-8 text-sm">Tu carrito está vacío 🌭</p>
                ) : (
                  cart.map((item, idx) => (
                    <div key={item.id} className="bg-slate-800/90 border border-slate-700 p-4 rounded-2xl space-y-3">
                      <div className="flex justify-between items-start border-b border-slate-700/60 pb-2">
                        <span className="text-xs font-black text-orange-400 uppercase tracking-wider">Orden #{idx + 1} (3 Banderillas)</span>
                        <div className="flex items-center gap-3">
                          <span className="font-black text-orange-400 text-sm">${item.price} MXN</span>
                          <button
                            type="button"
                            aria-label={`Eliminar orden ${idx + 1}`}
                            onClick={() => onRemoveItem(item.id)}
                            className="text-slate-400 hover:text-red-400 text-sm transition font-bold"
                            title="Eliminar producto"
                          >
                            ✕
                          </button>
                        </div>
                      </div>

                      <div className="font-bold text-sm text-white">{item.base}</div>

                      <div className="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800 space-y-2">
                        <span className="text-xs text-slate-300 font-extrabold uppercase tracking-wider block">Cubiertos de la Orden:</span>
                        <div className="grid grid-cols-3 gap-1.5">
                          {item.coatings.map((c, cIdx) => (
                            <div key={cIdx} className="bg-slate-900 p-1.5 rounded-lg border border-slate-700 flex flex-col items-center text-center">
                              <SafeImage
                                src={c.image}
                                alt={c.name}
                                fallbackEmoji="🌭"
                                className="w-8 h-8 object-cover rounded-md mb-1"
                              />
                              <span className="text-xs text-slate-300 font-bold">#{cIdx + 1}</span>
                              <span className="text-xs font-bold text-slate-200 truncate w-full">{c.name}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800 space-y-1.5">
                        <span className="text-xs text-slate-300 font-extrabold uppercase tracking-wider block">Salsas y Extras:</span>
                        <div className="flex flex-wrap gap-2">
                          {item.sauces !== 'Sin salsas ni extras' ? (
                            item.sauces.split(', ').map((sauceName, sIdx) => {
                              const sauceObj = availableSauces.find(s => s.name === sauceName);
                              return (
                                <div key={sIdx} className="flex items-center gap-1.5 bg-slate-800 px-2 py-1 rounded-lg border border-slate-700">
                                  <SafeImage src={sauceObj?.image} alt={sauceName} fallbackEmoji="🥫" className="w-4 h-4 rounded-full object-cover" />
                                  <span className="text-xs text-slate-200 font-medium">{sauceName}</span>
                                </div>
                              );
                            })
                          ) : (
                            <span className="text-xs text-slate-400 italic">Sin salsas seleccionadas</span>
                          )}
                        </div>
                      </div>

                      {item.drink && (
                        <div className="bg-amber-500/10 p-2.5 rounded-xl border border-amber-500/20 flex items-center gap-3">
                          <SafeImage
                            src={item.drinkImage}
                            alt={item.drink}
                            fallbackEmoji="🥤"
                            defaultFallbackUrl={PLACEHOLDER_DRINK}
                            className="w-10 h-10 object-cover rounded-lg border border-amber-400/50 flex-shrink-0"
                          />
                          <div>
                            <span className="text-xs text-amber-400 font-extrabold uppercase tracking-wider block">Bebida:</span>
                            <span className="text-xs font-bold text-white">{item.drink}</span>
                          </div>
                        </div>
                      )}
                    </div>
                  ))
                )}
              </div>

              {cart.length > 0 && (
                <div className="space-y-3 bg-slate-950 p-4 rounded-2xl border border-slate-800">
                  <div>
                    <label className="text-xs font-bold text-slate-200 block mb-1.5">
                      Nombre para la entrega <span className="text-orange-400">*</span>
                    </label>
                    <input
                      type="text"
                      placeholder="Ej. Juan Pérez"
                      value={customerName}
                      onChange={(e) => setCustomerName(e.target.value)}
                      className={`w-full bg-slate-900 border rounded-xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 transition-all ${
                        validationErrors.customerName 
                          ? 'border-red-500/80 focus:border-red-500 focus:ring-red-500 bg-red-950/20' 
                          : 'border-slate-700 focus:border-orange-500 focus:ring-orange-500'
                      }`}
                    />
                    {validationErrors.customerName && <span className="text-[10px] text-red-400 mt-1 block">Este campo es requerido</span>}
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-200 block mb-1.5">
                      Teléfono de Contacto <span className="text-orange-400">*</span>
                    </label>
                    <input
                      type="tel"
                      placeholder="Ej. 7441234567"
                      value={customerPhone}
                      onChange={(e) => setCustomerPhone(e.target.value)}
                      className={`w-full bg-slate-900 border rounded-xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 transition-all ${
                        validationErrors.customerPhone 
                          ? 'border-red-500/80 focus:border-red-500 focus:ring-red-500 bg-red-950/20' 
                          : 'border-slate-700 focus:border-orange-500 focus:ring-orange-500'
                      }`}
                    />
                    {validationErrors.customerPhone && <span className="text-[10px] text-red-400 mt-1 block">Ingresa un teléfono válido</span>}
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-200 block mb-1.5">Método de Pago:</label>
                    <select
                      aria-label="Método de pago"
                      value={paymentMethod}
                      onChange={(e) => setPaymentMethod(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-orange-500"
                    >
                      <option value="Efectivo">💵 Efectivo al Entregar</option>
                      <option value="Transferencia">📲 Transferencia bancaria</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-200 block mb-1.5">Tipo de entrega:</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        aria-label="Entrega a domicilio"
                        onClick={() => { playSound('click'); setDeliveryType('delivery'); }}
                        className={`py-2 rounded-xl text-xs font-bold transition-all transform active:scale-95 border ${deliveryType === 'delivery'
                          ? 'bg-orange-500 text-white border-orange-400 shadow'
                          : 'bg-slate-900 text-slate-300 border-slate-700 hover:border-slate-600'
                          }`}
                      >
                        🛵 A Domicilio
                      </button>
                      <button
                        type="button"
                        aria-label="Recoger en tienda"
                        onClick={() => { playSound('click'); setDeliveryType('pickup'); }}
                        className={`py-2 rounded-xl text-xs font-bold transition-all transform active:scale-95 border ${deliveryType === 'pickup'
                          ? 'bg-orange-500 text-white border-orange-400 shadow'
                          : 'bg-slate-900 text-slate-300 border-slate-700 hover:border-slate-600'
                          }`}
                      >
                        🏪 Recoger en Tienda
                      </button>
                    </div>
                  </div>

                  {deliveryType === 'delivery' && (
                    <div>
                      <label className="text-xs font-bold text-slate-200 block mb-1.5">
                        Dirección de envío <span className="text-orange-400">*</span>
                      </label>
                      <input
                        type="text"
                        placeholder="Calle, número, colonia..."
                        value={deliveryAddress}
                        onChange={(e) => setDeliveryAddress(e.target.value)}
                        className={`w-full bg-slate-900 border rounded-xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 transition-all ${
                          validationErrors.deliveryAddress 
                            ? 'border-red-500/80 focus:border-red-500 focus:ring-red-500 bg-red-950/20' 
                            : 'border-slate-700 focus:border-orange-500 focus:ring-orange-500'
                        }`}
                      />
                      {validationErrors.deliveryAddress && <span className="text-[10px] text-red-400 mt-1 block">Ingresa tu dirección</span>}
                    </div>
                  )}
                </div>
              )}
            </div>

            <div className="flex-shrink-0 pt-3 border-t border-slate-800 mt-2 bg-slate-900 space-y-3">
              <div className="space-y-1">
                <div className="flex justify-between text-xs text-slate-300">
                  <span>Subtotal:</span>
                  <span className="font-semibold text-white">${totalCartPrice} MXN</span>
                </div>
                {deliveryType === 'delivery' && (
                  <div className="flex justify-between text-xs text-slate-300">
                    <span>Envío:</span>
                    <span className="text-emerald-400 font-extrabold">¡Gratis!</span>
                  </div>
                )}
                <div className="flex justify-between font-black text-lg text-white pt-1.5 border-t border-slate-800">
                  <span>Total Final:</span>
                  <span className="text-orange-400">
                    ${totalCartPrice} MXN
                  </span>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <button
                  type="button"
                  aria-label="Agregar otra orden al carrito"
                  onClick={onClose}
                  className="w-full bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 border border-slate-700 font-bold py-3 rounded-xl transition-all transform shadow-md flex items-center justify-center gap-1.5 text-xs"
                >
                  ➕ Pedir otro
                </button>

                <button
                  type="button"
                  aria-label="Enviar pedido por WhatsApp"
                  onClick={onCheckout}
                  disabled={cart.length === 0 || !storeOpen}
                  className="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 disabled:opacity-50 text-white font-extrabold py-3 rounded-xl transition-all transform shadow-xl flex items-center justify-center gap-1.5 text-xs"
                >
                  💬 Enviar pedido
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    const initialOrderState = {
      selectedBase: null,
      selectedCoatings: [null, null, null],
      activeCoatingSlot: 0,
      selectedSauces: [],
      selectedDrink: null,
    };

    function orderReducer(state, action) {
      switch (action.type) {
        case 'SET_BASE':
          return { ...state, selectedBase: action.payload };
        case 'SET_COATING_SLOT':
          return { ...state, activeCoatingSlot: action.payload };
        case 'SET_COATING': {
          const updatedCoatings = [...state.selectedCoatings];
          updatedCoatings[state.activeCoatingSlot] = action.payload;
          const nextSlot = state.activeCoatingSlot < 2 ? state.activeCoatingSlot + 1 : state.activeCoatingSlot;
          return { ...state, selectedCoatings: updatedCoatings, activeCoatingSlot: nextSlot };
        }
        case 'TOGGLE_SAUCE': {
          const sauceId = action.payload;
          const exists = state.selectedSauces.includes(sauceId);
          if (exists) {
            return { ...state, selectedSauces: state.selectedSauces.filter(s => s !== sauceId) };
          } else {
            if (state.selectedSauces.length >= 6) return state;
            return { ...state, selectedSauces: [...state.selectedSauces, sauceId] };
          }
        }
        case 'SET_DRINK':
          return { ...state, selectedDrink: action.payload };
        case 'APPLY_PRESET': {
          const { preset, basesList, coatingsList, drinksList } = action.payload;
          return {
            selectedBase: basesList.find(b => b.id === preset.baseId) || null,
            selectedCoatings: preset.coatingIds.map(cId => coatingsList.find(c => c.id === cId) || null),
            activeCoatingSlot: 0,
            selectedSauces: preset.sauces,
            selectedDrink: drinksList.find(d => d.id === preset.drinkId) || null,
          };
        }
        case 'LOAD_FAVORITE': {
          const fav = action.payload;
          return {
            selectedBase: fav.base,
            selectedCoatings: fav.coatings || [fav.coating, fav.coating, fav.coating],
            activeCoatingSlot: 0,
            selectedSauces: fav.sauces,
            selectedDrink: fav.drink,
          };
        }
        case 'RESET':
          return initialOrderState;
        default:
          return state;
      }
    }

    function App() {
      const [orderState, dispatch] = useReducer(orderReducer, initialOrderState);
      const { selectedBase, selectedCoatings, activeCoatingSlot, selectedSauces, selectedDrink } = orderState;

      const [favoriteName, setFavoriteName] = useState('');
      const [savedFavorites, setSavedFavorites] = useState([]);
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const [deliveryType, setDeliveryType] = useState('delivery');
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [deliveryAddress, setDeliveryAddress] = useState('');
      const [paymentMethod, setPaymentMethod] = useState('Efectivo');
      const [validationErrors, setValidationErrors] = useState({});

      const [isOpen, setIsOpen] = useState(true);
      const [animKey, setAnimKey] = useState(0);

      const currentPrice = (selectedBase ? selectedBase.price : 0) +
        (selectedDrink ? selectedDrink.price : 0);

      const cartTotalCount = cart.length;
      const cartTotalPrice = cart.reduce((a, b) => a + b.price, 0);

      useEffect(() => {
        const checkOpenStatus = () => {
          const now = new Date();
          const hour = now.getHours();
          setIsOpen(hour >= OPEN_HOUR && hour < CLOSE_HOUR);
        };
        checkOpenStatus();
        const interval = setInterval(checkOpenStatus, 60000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        const localFavs = localStorage.getItem('banderilla_favs_pro');
        if (localFavs) {
          try { setSavedFavorites(JSON.parse(localFavs)); } catch (e) { }
        }
      }, []);

      const triggerAnimation = () => {
        setAnimKey(prev => prev + 1);
      };

      const handleBaseChange = (base) => {
        playSound('click');
        dispatch({ type: 'SET_BASE', payload: base });
        triggerAnimation();
      };

      const handleCoatingSelect = (coating) => {
        playSound('click');
        dispatch({ type: 'SET_COATING', payload: coating });
        triggerAnimation();
      };

      const handleCoatingSlotSelect = (slotIdx) => {
        playSound('click');
        dispatch({ type: 'SET_COATING_SLOT', payload: slotIdx });
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const toggleSauce = (id) => {
        playSound('click');
        if (!selectedSauces.includes(id) && selectedSauces.length >= 6) {
          showToast("Máximo 6 complementos por orden");
          return;
        }
        dispatch({ type: 'TOGGLE_SAUCE', payload: id });
      };

      const applyPreset = (preset) => {
        playSound('click');
        dispatch({
          type: 'APPLY_PRESET',
          payload: { preset, basesList: bases, coatingsList: coatings, drinksList: drinks }
        });
        triggerAnimation();
        showToast(`Preset "${preset.name}" cargado`);
      };

      const saveFavorite = () => {
        if (!selectedBase || selectedCoatings.some(c => c === null)) {
          showToast('⚠️ Selecciona tipo de orden y los 3 cubiertos para guardar');
          return;
        }
        if (!favoriteName.trim()) return;
        playSound('click');
        const newFav = {
          id: Date.now(),
          name: favoriteName,
          base: selectedBase,
          coatings: selectedCoatings,
          sauces: selectedSauces,
          drink: selectedDrink
        };
        const updated = [...savedFavorites, newFav];
        setSavedFavorites(updated);
        localStorage.setItem('banderilla_favs_pro', JSON.stringify(updated));
        setFavoriteName('');
        showToast('★ ¡Guardado en tus Favoritos!');
      };

      const loadFavorite = (fav) => {
        playSound('click');
        dispatch({ type: 'LOAD_FAVORITE', payload: fav });
        triggerAnimation();
        showToast(`Favorito "${fav.name}" cargado`);
      };

      const resetSelections = () => {
        playSound('click');
        dispatch({ type: 'RESET' });
        triggerAnimation();
      };

      const addToCart = () => {
        if (!isOpen) {
          showToast('⛔ El local está cerrado actualmente');
          return;
        }
        if (!selectedBase) {
          showToast('⚠️ Selecciona el tipo de orden');
          return;
        }
        if (selectedCoatings.some(c => c === null)) {
          showToast('⚠️ Selecciona el cubierto para las 3 banderillas');
          return;
        }

        playSound('add');
        const item = {
          id: Date.now(),
          base: selectedBase.name,
          coatings: selectedCoatings,
          sauces: selectedSauces.map(s => availableSauces.find(x => x.id === s)?.name).join(', ') || 'Sin salsas ni extras',
          drink: selectedDrink ? selectedDrink.name : null,
          drinkImage: selectedDrink ? selectedDrink.image : null,
          price: currentPrice
        };
        setCart([...cart, item]);
        setIsCartOpen(true);

        dispatch({ type: 'RESET' });
        triggerAnimation();
        showToast('🛒 ¡Orden agregada! Armador reiniciado.');
      };

      const removeFromCart = (id) => {
        if (window.confirm("¿Estás seguro de que deseas eliminar este producto de la orden?")) {
          playSound('click');
          setCart(cart.filter(item => item.id !== id));
          showToast('🗑️ Producto eliminado del carrito');
        }
      };

      const checkoutWhatsApp = () => {
        if (cart.length === 0 || !isOpen) return;

        const errors = {};
        if (!customerName.trim()) errors.customerName = true;
        if (!customerPhone.trim() || customerPhone.length < 8) errors.customerPhone = true;
        if (deliveryType === 'delivery' && !deliveryAddress.trim()) errors.deliveryAddress = true;

        setValidationErrors(errors);

        if (Object.keys(errors).length > 0) {
          showToast('⚠️ Revisa los campos requeridos marcados en rojo');
          return;
        }

        playSound('success');
        let message = "🌭 *¡NUEVO PEDIDO BANDERILLAS COREANAS!* 🌭\n";
        message += "📌 *TODAS LAS ÓRDENES INCLUYEN 3 BANDERILLAS*\n\n";
        message += `👤 *Cliente:* ${customerName.trim()}\n`;
        message += `📞 *Teléfono:* ${customerPhone.trim()}\n`;
        message += `💳 *Método de Pago:* ${paymentMethod}\n`;
        message += `📍 *Modalidad:* ${deliveryType === 'delivery' ? 'Envío a Domicilio 🛵' : 'Recoger en Sucursal 🏪'}\n`;
        message += `⏱️ *Tiempo Estimado:* ${deliveryType === 'delivery' ? '30-45 min' : '15-20 min'}\n`;
        if (deliveryType === 'delivery' && deliveryAddress.trim()) {
          message += `🏠 *Dirección:* ${deliveryAddress.trim()}\n`;
        }
        message += `\n`;

        cart.forEach((item, index) => {
          message += `*Orden #${index + 1}:*\n`;
          message += `• Selección: ${item.base}\n`;
          message += `• Cubiertos de la Orden:\n`;
          item.coatings.forEach((c, i) => {
            message += `   - Banderilla ${i + 1}: ${c.name}\n`;
          });
          message += `• Extras/Salsas: ${item.sauces}\n`;
          if (item.drink) message += `• Bebida: ${item.drink}\n`;
          message += `• Precio: $${item.price} MXN\n\n`;
        });

        const total = cart.reduce((a, b) => a + b.price, 0);

        message += `🛵 *Envío:* ${deliveryType === 'delivery' ? 'GRATIS' : 'N/A'}\n`;
        message += `💰 *TOTAL A PAGAR: $${total} MXN*\n\n`;
        message += "Por favor confirmen mi pedido para realizar el pago. ¡Muchas gracias! 🔥🧀🌭";

        const url = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');

        setCart([]);
        setCustomerName('');
        setCustomerPhone('');
        setDeliveryAddress('');
        setValidationErrors({});
        setIsCartOpen(false);
        showToast('✅ ¡Pedido enviado con éxito!');
      };

      return (
        <div className="min-h-screen flex flex-col md:flex-row relative">

          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 bg-orange-500 text-white font-bold px-4 py-3 rounded-xl shadow-2xl border border-orange-300 animate-bounce">
              {toastMessage}
            </div>
          )}

          {/* Botón Flotante del Carrito */}
          {cartTotalCount > 0 && !isCartOpen && (
            <button
              type="button"
              aria-label="Abrir carrito"
              onClick={() => { playSound('click'); setIsCartOpen(true); }}
              className="fixed bottom-6 right-6 z-40 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-extrabold px-5 py-3.5 rounded-full shadow-2xl transition-all transform hover:scale-105 active:scale-95 flex items-center gap-3 border border-orange-300/40"
            >
              <div className="relative">
                <span className="text-xl">🛒</span>
                <span className="absolute -top-2 -right-2 bg-red-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border border-white">
                  {cartTotalCount}
                </span>
              </div>
              <div className="flex flex-col text-left">
                <span className="text-[10px] uppercase font-bold text-orange-100">Ver Carrito</span>
                <span className="text-sm font-black">${cartTotalPrice} MXN</span>
              </div>
            </button>
          )}

          {/* Vista previa izquierda */}
          <div className="w-full md:w-1/2 min-h-[320px] max-h-[45vh] md:max-h-none md:min-h-[520px] md:h-screen sticky top-0 md:relative z-30 bg-slate-900 flex flex-col items-center justify-center p-4 md:p-12 overflow-y-auto md:overflow-hidden border-b md:border-b-0 md:border-r border-slate-800 shadow-xl md:shadow-none">

            <div className="absolute w-[300px] h-[300px] bg-orange-500/20 rounded-full blur-3xl glow-effect pointer-events-none"></div>

            <div className="relative w-full h-full flex flex-col items-center justify-center gap-4 md:gap-6 z-10 my-auto max-w-xl">

              {/* TARJETA CABECERA CENTRADA Y APILADA */}
              <div className="bg-slate-900/90 backdrop-blur-md px-8 py-5 rounded-3xl border border-slate-800/80 shadow-2xl flex flex-col items-center justify-center text-center gap-2.5 w-full max-w-md">
                <h1 className="text-xl md:text-2xl font-black text-amber-500 tracking-wide">
                  Banderillas Coreanas
                </h1>
                
                <div className="flex items-center justify-center">
                  <span className={`inline-flex items-center justify-center gap-1.5 text-xs font-bold px-3 py-1 rounded-full border ${isOpen
                    ? 'bg-emerald-950/80 text-emerald-400 border-emerald-500/30'
                    : 'bg-rose-950/80 text-rose-400 border-rose-500/30'
                    }`}>
                    <span className={`w-2 h-2 rounded-full ${isOpen ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500'}`}></span>
                    {isOpen ? 'Abierto Ahora' : 'Local Cerrado'}
                  </span>
                </div>

                <p className="text-xs text-slate-300 font-medium tracking-wide">
                  Horario: 1:00 PM - 8:00 PM
                </p>
              </div>

              {/* Render visual de las 3 Banderillas seleccionadas */}
              <div className="relative flex justify-center items-center w-full min-h-[180px] md:min-h-[280px]">
                <div className="grid grid-cols-3 gap-2 md:gap-4 w-full max-w-md">
                  {selectedCoatings.map((c, idx) => {
                    const isEditing = activeCoatingSlot === idx;
                    return (
                      <div 
                        key={idx} 
                        onClick={() => handleCoatingSlotSelect(idx)}
                        className={`relative flex flex-col items-center justify-center p-2 rounded-2xl border-2 transition-all cursor-pointer transform hover:scale-[1.02] ${
                          isEditing 
                            ? 'border-orange-500 bg-orange-500/10 shadow-lg ring-2 ring-orange-500/40 scale-105' 
                            : 'border-slate-800 bg-slate-900/60 hover:border-slate-700'
                        }`}
                      >
                        <div className="flex items-center gap-1 mb-1">
                          <span className="text-xs font-extrabold text-orange-400">
                            #{idx + 1}
                          </span>
                          {isEditing && (
                            <span className="bg-orange-500 text-[9px] font-black text-white px-1.5 py-0.2 rounded-full uppercase tracking-wider animate-pulse">
                              Editando
                            </span>
                          )}
                        </div>

                        {c ? (
                          <div key={`${idx}-${animKey}`} className="animate-pop w-full flex flex-col items-center">
                            <SafeImage
                              src={c.image}
                              alt={c.name}
                              fallbackEmoji="🌭"
                              className="h-24 md:h-40 w-full object-cover rounded-xl shadow-md border border-orange-500/30"
                            />
                            <span className="text-xs font-bold text-center mt-1.5 truncate w-full text-slate-100">
                              {c.name}
                            </span>
                          </div>
                        ) : (
                          <div className="h-24 md:h-40 w-full border-2 border-dashed border-slate-700 rounded-xl flex flex-col items-center justify-center text-center p-1 text-slate-400">
                            <span className="text-xl md:text-3xl mb-1">🌭</span>
                            <span className="text-xs font-semibold text-slate-300">Elige Cubierto</span>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="w-full flex flex-wrap items-center justify-center gap-2 md:gap-3 z-20 pt-1 md:pt-2">
                {selectedBase ? (
                  <div className="flex items-center gap-2 bg-orange-500/20 border-2 border-orange-500/60 px-3 py-1 md:px-4 md:py-1.5 rounded-xl md:rounded-2xl shadow-xl">
                    <span className="text-sm md:text-base">{selectedBase.icon}</span>
                    <div className="flex flex-col text-left">
                      <span className="text-xs text-orange-400 font-extrabold uppercase tracking-wider">Orden Seleccionada</span>
                      <span className="text-xs font-bold text-white">{selectedBase.name}</span>
                    </div>
                  </div>
                ) : (
                  <span className="text-xs text-slate-300 bg-slate-800/80 px-2.5 py-1 md:px-3 md:py-1.5 rounded-xl border border-slate-700">Sin Selección Base</span>
                )}

                {selectedSauces.map(sId => {
                  const sData = availableSauces.find(x => x.id === sId);
                  if (!sData) return null;
                  return (
                    <div
                      key={sId}
                      className="flex items-center gap-1.5 md:gap-2 bg-slate-900 text-white border border-slate-700 px-3 py-1 md:px-4 md:py-2 rounded-xl md:rounded-2xl shadow-xl"
                    >
                      <SafeImage src={sData.image} alt={sData.name} fallbackEmoji="🥫" className="w-5 h-5 md:w-6 md:h-6 rounded-full object-cover border border-slate-600" />
                      <span className="text-xs font-bold">{sData.name}</span>
                    </div>
                  );
                })}

                {selectedDrink && (
                  <div className="flex items-center gap-2 bg-amber-500/20 border-2 border-amber-500/60 px-3 py-1 md:px-4 md:py-1.5 rounded-xl md:rounded-2xl shadow-2xl">
                    <SafeImage
                      src={selectedDrink.image}
                      alt={selectedDrink.name}
                      fallbackEmoji="🥤"
                      defaultFallbackUrl={PLACEHOLDER_DRINK}
                      className="w-6 h-6 md:w-8 md:h-8 rounded-lg object-cover border border-amber-400/80 shadow-md"
                    />
                    <div className="flex flex-col text-left">
                      <span className="text-xs text-amber-400 font-extrabold uppercase tracking-wider">Bebida (+${selectedDrink.price} MXN)</span>
                      <span className="text-xs font-bold text-white">{selectedDrink.name}</span>
                    </div>
                  </div>
                )}
              </div>

            </div>
          </div>

          {/* Panel Lateral */}
          <div className="w-full md:w-1/2 p-6 md:p-10 overflow-y-auto md:max-h-screen bg-slate-950 flex flex-col justify-between">
            <div>

              <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                <span className="text-xs font-extrabold text-slate-400 uppercase tracking-wider">Personaliza tu Pedido</span>
                <button
                  type="button"
                  aria-label="Reiniciar selección actual"
                  onClick={resetSelections}
                  className="text-xs text-slate-400 hover:text-orange-400 transition font-medium flex items-center gap-1 bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-lg"
                >
                  🔄 Reiniciar selección
                </button>
              </div>

              <PresetList presets={chefPresets} onApply={applyPreset} />

              {savedFavorites.length > 0 && (
                <div className="mb-6 bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800">
                  <h3 className="text-xs font-bold text-orange-400 uppercase tracking-wider mb-2">Mis Combinaciones Guardadas</h3>
                  <div className="flex flex-wrap gap-2">
                    {savedFavorites.map(fav => (
                      <button
                        key={fav.id}
                        type="button"
                        aria-label={`Cargar favorito ${fav.name}`}
                        onClick={() => loadFavorite(fav)}
                        className="bg-orange-500/20 text-orange-300 border border-orange-500/40 text-xs px-3 py-1.5 rounded-xl hover:bg-orange-500/30 transition-all transform active:scale-95 font-semibold"
                      >
                        ★ {fav.name}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* Opción 1: Selección de Orden */}
              <div className="mb-6">
                <div className="flex justify-between items-center mb-1.5">
                  <h3 className="text-sm font-bold text-orange-400 flex items-center gap-1.5">
                    <span className="w-5 h-5 bg-orange-500/20 text-orange-400 rounded-full flex items-center justify-center text-xs border border-orange-500/40">1</span>
                    Elige tu Orden (Incluye 3 Banderillas)
                  </h3>
                </div>
                <div className="grid grid-cols-1 gap-2">
                  {bases.map(b => {
                    const isSelected = selectedBase?.id === b.id;
                    return (
                      <button
                        key={b.id}
                        type="button"
                        aria-label={`Seleccionar base ${b.name}`}
                        onClick={() => handleBaseChange(b)}
                        className={`p-3.5 rounded-xl border text-left flex justify-between items-center transition-all transform hover:scale-[1.01] active:scale-95 ${isSelected
                          ? 'border-orange-500 bg-orange-500/20 text-white shadow-lg font-semibold ring-1 ring-orange-500/30'
                          : 'border-slate-800 bg-slate-900/60 text-slate-300 hover:border-slate-700'
                          }`}
                      >
                        <div className="flex items-center gap-2">
                          <span>{b.icon}</span>
                          <span className="font-medium text-sm">{b.name}</span>
                          {b.badge && <span className="bg-orange-500/30 text-orange-300 text-[11px] font-bold px-2 py-0.5 rounded-full border border-orange-500/40">{b.badge}</span>}
                        </div>
                        <span className="font-extrabold text-orange-400 text-sm">${b.price} MXN</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Opción 2: Elige los 3 Cubiertos Individuales */}
              <CoatingSelector
                activeSlot={activeCoatingSlot}
                coatings={coatings}
                selectedCoatings={selectedCoatings}
                onSelectSlot={handleCoatingSlotSelect}
                onSelectCoating={handleCoatingSelect}
              />

              {/* Opción 3: Salsas y Extras */}
              <div className="mb-6">
                <div className="flex justify-between items-center mb-2.5">
                  <h3 className="text-sm font-bold text-orange-400 flex items-center gap-1.5">
                    <span className="w-5 h-5 bg-orange-500/20 text-orange-400 rounded-full flex items-center justify-center text-xs border border-orange-500/40">3</span>
                    Salsas y Extras
                  </h3>
                  <span className="text-xs text-slate-300">(Elegidos: {selectedSauces.length})</span>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-2.5">
                  {availableSauces.map(s => {
                    const active = selectedSauces.includes(s.id);
                    return (
                      <button
                        key={s.id}
                        type="button"
                        aria-label={`Seleccionar salsa ${s.name}`}
                        onClick={() => toggleSauce(s.id)}
                        className={`p-2 rounded-xl border flex items-center gap-2.5 transition-all transform hover:scale-[1.02] active:scale-95 ${active
                          ? 'border-orange-500 bg-orange-500/30 text-white font-bold shadow ring-1 ring-orange-500/30'
                          : 'border-slate-800 bg-slate-900/60 text-slate-300 hover:border-slate-700'
                          }`}
                      >
                        <SafeImage
                          src={s.image}
                          alt={s.name}
                          fallbackEmoji="🥫"
                          className="w-8 h-8 rounded-lg object-cover border border-slate-700 flex-shrink-0"
                        />
                        <span className="text-xs font-medium truncate">{active ? '✓ ' : ''}{s.name}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Opción 4: Bebida */}
              <div className="mb-6">
                <h3 className="text-sm font-bold text-orange-400 mb-2.5 flex items-center gap-1.5">
                  <span className="w-5 h-5 bg-orange-500/20 text-orange-400 rounded-full flex items-center justify-center text-xs border border-orange-500/40">4</span>
                  Bebida Opcional
                </h3>
                <div className="grid grid-cols-2 gap-2.5">
                  {drinks.map(d => {
                    const isSelected = selectedDrink?.id === d.id;
                    return (
                      <button
                        key={d.id}
                        type="button"
                        aria-label={`Seleccionar bebida ${d.name}`}
                        onClick={() => {
                          playSound('click');
                          dispatch({ type: 'SET_DRINK', payload: isSelected ? null : d });
                        }}
                        className={`p-2.5 rounded-xl border text-left text-xs flex items-center gap-3 transition-all transform hover:scale-[1.02] active:scale-95 ${isSelected
                          ? 'border-orange-500 bg-orange-500/20 text-white shadow-lg font-semibold ring-1 ring-orange-500/30'
                          : 'border-slate-800 bg-slate-900/60 text-slate-300 hover:border-slate-700'
                          }`}
                      >
                        <SafeImage
                          src={d.image}
                          alt={d.name}
                          fallbackEmoji="🥤"
                          defaultFallbackUrl={PLACEHOLDER_DRINK}
                          className="w-12 h-12 object-cover rounded-lg border border-slate-700 flex-shrink-0"
                        />
                        <div className="flex flex-col justify-between flex-1 min-w-0">
                          <span className="font-semibold text-slate-200 truncate">{d.name}</span>
                          <span className="font-extrabold text-orange-400 mt-1">${d.price} MXN</span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="mb-6 flex gap-2">
                <input
                  type="text"
                  placeholder="Guarda esta orden (ej. Mi Orden Especial)..."
                  value={favoriteName}
                  onChange={(e) => setFavoriteName(e.target.value)}
                  className="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs flex-1 text-white placeholder-slate-400 focus:outline-none focus:border-orange-500 transition"
                />
                <button
                  type="button"
                  aria-label="Guardar orden como favorita"
                  onClick={saveFavorite}
                  className="bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-semibold px-4 py-2 rounded-xl transition-all transform border border-slate-700 text-slate-200"
                >
                  ★ Guardar
                </button>
              </div>
            </div>

            <div className="pt-4 border-t border-slate-800 flex items-center justify-between gap-4">
              <div>
                <span className="text-3xl font-black text-orange-400">${currentPrice} MXN</span>
                <span className="text-xs text-slate-300 block">Incluye 3 Banderillas + Cubiertos</span>
              </div>
              <button
                type="button"
                aria-label="Agregar orden completa al carrito"
                onClick={addToCart}
                disabled={!isOpen || !selectedBase || selectedCoatings.some(c => c === null)}
                className="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-xl hover:shadow-orange-500/20 transition-all transform active:scale-95 flex items-center gap-2 text-xs md:text-sm"
              >
                <span>{!selectedBase || selectedCoatings.some(c => c === null) ? 'Elige 3 Cubiertos' : 'Agregar Orden al Carrito'}</span>
                <span className="bg-white/20 px-2 py-0.5 rounded-lg text-xs">🛒</span>
              </button>
            </div>
          </div>

          {/* Modal Carrito Componentizado */}
          <CartModal
            isOpen={isCartOpen}
            cart={cart}
            storeOpen={isOpen}
            deliveryType={deliveryType}
            customerName={customerName}
            customerPhone={customerPhone}
            deliveryAddress={deliveryAddress}
            paymentMethod={paymentMethod}
            validationErrors={validationErrors}
            onClose={() => { playSound('click'); setIsCartOpen(false); }}
            onRemoveItem={removeFromCart}
            onCheckout={checkoutWhatsApp}
            setCustomerName={setCustomerName}
            setCustomerPhone={setCustomerPhone}
            setDeliveryAddress={setDeliveryAddress}
            setPaymentMethod={setPaymentMethod}
            setDeliveryType={setDeliveryType}
          />

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
