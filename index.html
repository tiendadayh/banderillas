        activeCoatingSlot: action.payload

        return {
          ...state,
          selectedCoatings: updatedCoatings,
          activeCoatingSlot: nextSlot

    case 'TOGGLE_SAUCE':

        const exists = state.selectedSauces.some(s => s.id === sauceObj.id);
        if (exists) {
          return {
            ...state,
            selectedSauces: state.selectedSauces.filter(s => s.id !== sauceObj.id)

          if (state.selectedSauces.length >= 6) return state;
          return {
            ...state,

        const {
          preset,
          basesList,
          drinksList
        } = action.payload;
        return {
          selectedBase: basesList.find(b => b.id === preset.baseId) || null,
          selectedCoatings: [...preset.coatingIds.map(cId => coatings.find(c => c.id === cId) || null)],
          activeCoatingSlot: 0,
          selectedSauces: [...preset.sauces],
          selectedDrink: drinksList.find(d => d.id === preset.drinkId) || null
        };
      }
    case 'LOAD_FAVORITE':
      {
        const fav = action.payload;
        return {
          selectedBase: fav.base,
          selectedCoatings: fav.coatings || [fav.coating, fav.coating, fav.coating],
          activeCoatingSlot: 0,
          selectedSauces: fav.sauces,

      ),
      h('div', { className: 'flex items-center' },
        STEPS.map((s, i) => h(React.Fragment, { key: s.id },
          h('div', { className: 'flex flex-col items-center flex-1' },
            h('div', {
              className: `w-7 h-7 rounded-full flex items-center justify-center text-xs ${i <= idx ? 'bg-orange-500 text-white' : 'bg-slate-700 text-slate-500'}`
            }, s.emoji),
            h('span', { className: `text-[9px] mt-1 text-center ${i <= idx ? 'text-orange-300' : 'text-slate-500'}` }, s.label)
          ),
          i < STEPS.length - 1 && h('div', { className: `h-0.5 flex-1 -mt-4 ${i < idx ? 'bg-orange-500' : 'bg-slate-700'}` })
        ))
      )
    );
  }

  function TrackingWidget() {
    const [tracked, setTracked] = useState([]);
    const [open, setOpen] = useState(false);

    useEffect(() => {
      try {
        const saved = JSON.parse(localStorage.getItem('banderillas_tracked_orders') || '[]');
        const fresh = saved.filter(o => {
          const ageH = (Date.now() - new Date(o.timestamp).getTime()) / 3600000;
          return ageH <= MAX_AGE_HOURS;
        });
        localStorage.setItem('banderillas_tracked_orders', JSON.stringify(fresh));
        setTracked(fresh);
      } catch (e) {}
    }, []);

    if (tracked.length === 0) return null;

    return h(React.Fragment, null,
      h('button', {
        onClick: () => setOpen(true),
        className: 'fixed bottom-5 right-5 z-40 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold text-sm px-4 py-3 rounded-full shadow-2xl shadow-orange-500/30 flex items-center gap-2'
      }, '📦 Mis Pedidos', h('span', { className: 'bg-white/25 rounded-full px-2 py-0.5 text-xs' }, tracked.length)),
      open && h('div', {
        className: 'fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-3',
        onClick: () => setOpen(false)
      },
        h('div', {
          className: 'bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-4 max-h-[80vh] overflow-y-auto',
          onClick: e => e.stopPropagation()
        },
          h('div', { className: 'flex justify-between items-center mb-3' },
            h('h2', { className: 'font-bold text-white text-base' }, '📦 Seguimiento de mis pedidos'),
            h('button', { onClick: () => setOpen(false), className: 'text-slate-400 hover:text-white text-xl leading-none' }, '×')
          ),
          h('div', { className: 'space-y-3' },
            tracked.map(t => h(TrackedOrderCard, { key: t.key, tracked: t }))
          ),
          h('p', { className: 'text-[10px] text-slate-500 mt-3' }, 'El estado se actualiza en vivo. Si tienes dudas, contáctanos por WhatsApp.')
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('tracking-root')).render(h(TrackingWidget, null));
})();
  </script>
  <!-- Deslizar hacia abajo para actualizar -->
  <div id="ptr-indicator" style="position:fixed;top:0;left:50%;transform:translate(-50%,-60px);width:38px;height:38px;display:flex;align-items:center;justify-content:center;z-index:99999;pointer-events:none;">
    <div id="ptr-spinner" style="width:26px;height:26px;border-radius:50%;border:3px solid rgba(249,115,22,0.25);border-top-color:#f97316;opacity:0;"></div>
  </div>
  <style>
    @keyframes ptr-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
  <script>
    (function () {
      var indicator = document.getElementById('ptr-indicator');
      var spinner = document.getElementById('ptr-spinner');
      var THRESHOLD = 70;
      var MAX_PULL = 110;
      var startY = 0;
      var currentPull = 0;
      var pulling = false;
      var refreshing = false;

      function isInsideOverlay(el) {
        while (el && el !== document.body) {
          var cls = el.className && el.className.baseVal !== undefined ? el.className.baseVal : el.className;
          if (typeof cls === 'string' && cls.indexOf('fixed') !== -1 && cls.indexOf('inset-0') !== -1) {
            return true;
          }
          el = el.parentElement;
        }
        return false;
      }

      function findScrollableAncestor(el) {
        while (el && el !== document.body) {
          var style = window.getComputedStyle(el);
          if ((style.overflowY === 'auto' || style.overflowY === 'scroll') && el.scrollHeight > el.clientHeight) {
            return el;
          }
          el = el.parentElement;
        }
        return null;
      }

      function getScrollTop(el) {
        return el ? el.scrollTop : (window.scrollY || document.documentElement.scrollTop);
      }

      function setPull(px) {
        currentPull = px;
        indicator.style.transform = 'translate(-50%, ' + (px - 60) + 'px)';
        spinner.style.opacity = Math.min(px / THRESHOLD, 1);
        spinner.style.transform = 'rotate(' + (px * 3) + 'deg)';
      }

      document.addEventListener('touchstart', function (e) {
        if (refreshing) return;
        var target = e.touches[0].target;
        if (isInsideOverlay(target)) { pulling = false; return; }
        var scrollEl = findScrollableAncestor(target);
        if (getScrollTop(scrollEl) <= 0) {
          startY = e.touches[0].clientY;
          pulling = true;
          window.__ptrScrollEl = scrollEl;
        } else {
          pulling = false;
        }
      }, { passive: true });

      document.addEventListener('touchmove', function (e) {
        if (!pulling || refreshing) return;
        var deltaY = e.touches[0].clientY - startY;
        if (deltaY <= 0 || getScrollTop(window.__ptrScrollEl) > 0) {
          setPull(0);
          return;
        }
        e.preventDefault();
        setPull(Math.min(deltaY, MAX_PULL));
      }, { passive: false });

      document.addEventListener('touchend', function () {
        if (!pulling || refreshing) { pulling = false; return; }
        pulling = false;
        if (currentPull >= THRESHOLD) {
          refreshing = true;
          indicator.style.transition = 'transform 0.15s ease';
          indicator.style.transform = 'translate(-50%, 12px)';
          spinner.style.opacity = 1;
          spinner.style.animation = 'ptr-spin 0.6s linear infinite';
          setTimeout(function () { window.location.reload(); }, 250);
        } else {
          indicator.style.transition = 'transform 0.2s ease';
          setPull(0);
          setTimeout(function () { indicator.style.transition = ''; }, 200);
        }
      }, { passive: true });
    })();
  </script>
