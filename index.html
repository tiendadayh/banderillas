<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banderillas</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    .glow-effect {
      animation: pulseGlow 4s infinite ease-in-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans selection:bg-orange-500 selection:text-white transition-colors duration-300">

  <!-- ==================== PORTADA / HERO SECTION ==================== -->
  <header class="relative overflow-hidden bg-gradient-to-b from-slate-900 via-slate-950 to-slate-950 border-b border-slate-800 py-12 md:py-20 px-6 md:px-12">
    
    <!-- Resplandor decorativo de fondo -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-orange-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-10 items-center relative z-10">
      
      <!-- Texto y Llamada a la Acción -->
      <div class="space-y-6 text-center md:text-left">
        <span class="inline-flex items-center gap-2 bg-orange-500/10 border border-orange-500/30 text-orange-400 font-bold text-xs uppercase tracking-widest px-3.5 py-1.5 rounded-full">
          🔥 Especialidad de la Casa
        </span>

        <h1 class="text-4xl md:text-6xl font-black text-white leading-tight">
          El Sabor Perfecto en <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-400">Cada Bocado</span>
        </h1>

        <p class="text-slate-400 text-sm md:text-base leading-relaxed max-w-lg mx-auto md:mx-0">
          Descubre nuestra selección de banderillas artesanalmente empanizadas, rellenas con los mejores ingredientes y acompañadas de tus salsas favoritas.
        </p>

        <!-- Botones -->
        <div class="flex flex-wrap justify-center md:justify-start gap-4 pt-2">
          <a href="#creador" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-extrabold px-6 py-3.5 rounded-2xl shadow-lg shadow-orange-500/20 transition transform active:scale-95 text-sm flex items-center gap-2">
            <span>Armar mi Pedido</span>
            <span>🌭</span>
          </a>
        </div>
      </div>

      <!-- Imagen Destacada de la Portada -->
      <div class="relative flex justify-center">
        <!-- Badge flotante -->
        <div class="absolute -top-3 -right-3 z-20 bg-amber-400 text-slate-950 font-black text-xs px-3 py-1.5 rounded-full shadow-lg border border-amber-300 transform rotate-6">
          ⭐ ¡Súper Crujientes!
        </div>

        <div class="relative group w-full max-w-md">
          <div class="absolute -inset-1 bg-gradient-to-r from-orange-500 to-amber-500 rounded-3xl blur opacity-30 group-hover:opacity-60 transition duration-500"></div>
          
          <img 
            src="portada.jpg" 
            alt="Portada Productos" 
            class="relative rounded-3xl border-2 border-slate-700 object-cover w-full h-72 md:h-96 shadow-2xl"
            onerror="this.src='https://images.unsplash.com/photo-1561758033-d89a9ad46330?auto=format&fit=crop&w=800&q=80'"
          />
        </div>
      </div>

    </div>
  </header>
  <!-- ==================== FIN DE LA PORTADA ==================== -->

  <!-- ==================== CREADOR DE BANDERILLAS ==================== -->
  <div id="creador">
    <div id="root"></div>
  </div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const PHONE_NUMBER = "527442411773";
    const OPEN_HOUR = 13;
    const CLOSE_HOUR = 23;

    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        } else if (type === 'add') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.16);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {}
    };

    const bases = [
      { id: 'salchicha', name: 'Salchicha Tradicional', price: 45, badge: null, icon: '🌭' },
      { id: 'queso', name: 'Solo Queso Gouda', price: 50, badge: '🧀 Recomendado', icon: '🧀' },
      { id: 'mixta', name: 'Mitad Salchicha / Mitad Queso', price: 55, badge: '🔥 Más Vendido', icon: '⚡' }
    ];

    const coatings = [
      { id: 'panko', name: 'Panko Crujiente', price: 0, badge: 'Clásico', image: 'panko.jpg' },
      { id: 'papas', name: 'Cubos de Papa Frita', price: 15, badge: '⭐ Popular', image: 'papas.jpg' },
      { id: 'ramen', name: 'Fideos Ramen Tostados', price: 12, badge: 'Crujiente', image: 'ramen.jpg' },
      { id: 'flamin', name: 'Crujiente Flamin Hot', price: 18, badge: '🌶️ Picoso', image: 'flamin.jpg' }
    ];

    const availableSauces = [
      { id: 'ketchup', name: 'Ketchup', image: 'ketchup.jpg' },
      { id: 'queso_amarillo', name: 'Queso Amarillo', image: 'queso.jpg' },
      { id: 'chile_vinagre', name: 'Chile en Vinagre', image: 'chile.jpg' }
    ];

    const drinks = [
      { id: 'boba', name: 'Coca Cola (355ml)', price: 40, image: 'coca.jpg' },
      { id: 'soda', name: 'Refresco de Lata (355ml)', price: 25, image: 'soda.jpg' },
      { id: 'agua', name: 'Agua de Horchata', price: 30, image: 'horchata.jpg' }
    ];

    const chefPresets = [
      { name: '🔥 La Flamin Fuego', baseId: 'mixta', coatingId: 'flamin', sauces: ['ketchup', 'queso_amarillo'], drinkId: 'agua' },
      { name: '🧀 La Suprema Quesera', baseId: 'queso', coatingId: 'papas', sauces: ['queso_amarillo', 'ketchup'], drinkId: 'boba' },
      { name: '🌭 La Clásica Panko', baseId: 'salchicha', coatingId: 'panko', sauces: ['ketchup', 'chile_vinagre'], drinkId: 'soda' }
    ];

    function SafeImage({ src, alt, className, fallbackEmoji = "🌭" }) {
      const [error, setError] = useState(false);
      useEffect(() => { setError(false); }, [src]);

      if (error || !src) {
        return (
          <div className={`${className} bg-slate-800 flex items-center justify-center text-2xl select-none border border-slate-700`}>
            <span>{fallbackEmoji}</span>
          </div>
        );
      }
      return <img src={src} alt={alt} className={className} onError={() => setError(true)} />;
    }

    function App() {
      const [selectedBase, setSelectedBase] = useState(null);
      const [selectedCoating, setSelectedCoating] = useState(null);
      const [selectedSauces, setSelectedSauces] = useState([]);
      const [selectedDrink, setSelectedDrink] = useState(null);
      
      const [favoriteName, setFavoriteName] = useState('');
      const [savedFavorites, setSavedFavorites] = useState([]);
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const [deliveryType, setDeliveryType] = useState('delivery'); 
      const [customerName, setCustomerName] = useState('');
      const [deliveryAddress, setDeliveryAddress] = useState('');

      const [isOpen, setIsOpen] = useState(true);
      const [animKey, setAnimKey] = useState(0);

      const currentPrice = (selectedBase ? selectedBase.price : 0) + 
                           (selectedCoating ? selectedCoating.price : 0) + 
                           (selectedDrink ? selectedDrink.price : 0);

      useEffect(() => {
        const checkOpenStatus = () => {
          const now = new Date();
          const hour = now.getHours();
          setIsOpen(hour >= OPEN_HOUR && hour < CLOSE_HOUR);
        };
        checkOpenStatus();
        const interval = setInterval(checkOpenStatus, 60000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        const localFavs = localStorage.getItem('banderilla_favs_pro');
        if (localFavs) {
          try { setSavedFavorites(JSON.parse(localFavs)); } catch (e) {}
        }
      }, []);

      const triggerAnimation = () => {
        setAnimKey(prev => prev + 1);
      };

      const handleBaseChange = (base) => {
        playSound('click');
        setSelectedBase(base);
        triggerAnimation();
      };

      const handleCoatingChange = (coating) => {
        playSound('click');
        setSelectedCoating(coating);
        triggerAnimation();
      };

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const toggleSauce = (id) => {
        playSound('click');
        if (selectedSauces.includes(id)) {
          setSelectedSauces(selectedSauces.filter(s => s !== id));
        } else {
          if (selectedSauces.length >= 6) {
            showToast("Máximo 6 complementos por banderilla");
            return;
          }
          setSelectedSauces([...selectedSauces, id]);
        }
      };

      const applyPreset = (preset) => {
        playSound('click');
        setSelectedBase(bases.find(b => b.id === preset.baseId) || null);
        setSelectedCoating(coatings.find(c => c.id === preset.coatingId) || null);
        setSelectedSauces(preset.sauces);
        setSelectedDrink(drinks.find(d => d.id === preset.drinkId) || null);
        triggerAnimation();
        showToast(`Preset "${preset.name}" cargado`);
      };

      const saveFavorite = () => {
        if (!selectedBase || !selectedCoating) {
          showToast('⚠️ Selecciona relleno y cobertura para guardar');
          return;
        }
        if (!favoriteName.trim()) return;
        playSound('click');
        const newFav = {
          id: Date.now(),
          name: favoriteName,
          base: selectedBase,
          coating: selectedCoating,
          sauces: selectedSauces,
          drink: selectedDrink
        };
        const updated = [...savedFavorites, newFav];
        setSavedFavorites(updated);
        localStorage.setItem('banderilla_favs_pro', JSON.stringify(updated));
        setFavoriteName('');
        showToast('★ ¡Guardado en tus Favoritos!');
      };

      const loadFavorite = (fav) => {
        playSound('click');
        setSelectedBase(fav.base);
        setSelectedCoating(fav.coating);
        setSelectedSauces(fav.sauces);
        setSelectedDrink(fav.drink);
        triggerAnimation();
        showToast(`Favorito "${fav.name}" cargado`);
      };

      const resetSelections = () => {
        setSelectedBase(null);
        setSelectedCoating(null);
        setSelectedSauces([]);
        setSelectedDrink(null);
        triggerAnimation();
      };

      const addToCart = () => {
        if (!isOpen) {
          showToast('⛔ El local está cerrado actualmente');
          return;
        }
        if (!selectedBase || !selectedCoating) {
          showToast('⚠️ Selecciona un relleno base y cobertura');
          return;
        }
        playSound('add');
        const item = {
          id: Date.now(),
          base: selectedBase.name,
          coating: selectedCoating.name,
          image: selectedCoating.image,
          sauces: selectedSauces.map(s => availableSauces.find(x => x.id === s)?.name).join(', ') || 'Sin salsas ni extras',
          drink: selectedDrink ? selectedDrink.name : null,
          drinkImage: selectedDrink ? selectedDrink.image : null,
          price: currentPrice
        };
        setCart([...cart, item]);
        setIsCartOpen(true);
        
        resetSelections();
        showToast('🛒 ¡Banderilla agregada! Armador reiniciado.');
      };

      const removeFromCart = (id) => {
        playSound('click');
        setCart(cart.filter(item => item.id !== id));
        showToast('🗑️ Producto eliminado del carrito');
      };

      const checkoutWhatsApp = () => {
        if (cart.length === 0 || !isOpen) return;

        if (deliveryType === 'delivery' && !deliveryAddress.trim()) {
          showToast('⚠️ Escribe la dirección de envío');
          return;
        }
        
        playSound('success');
        let message = "🌭 *¡NUEVO PEDIDO BANDERILLAS!* 🌭\n";
        if (customerName.trim()) message += `👤 *Cliente:* ${customerName}\n`;
        message += `📍 *Modalidad:* ${deliveryType === 'delivery' ? 'Envío a Domicilio 🛵' : 'Recoger en Sucursal 🏪'}\n`;
        message += `⏱️ *Tiempo Estimado:* ${deliveryType === 'delivery' ? '30-45 min' : '15-20 min'}\n`;
        if (deliveryType === 'delivery' && deliveryAddress.trim()) {
          message += `🏠 *Dirección:* ${deliveryAddress.trim()}\n`;
        }
        message += `\n`;

        cart.forEach((item, index) => {
          message += `*Item #${index + 1}:*\n`;
          message += `• Base: ${item.base}\n`;
          message += `• Cobertura: ${item.coating}\n`;
          message += `• Extras/Salsas: ${item.sauces}\n`;
          if (item.drink) message += `• Bebida: ${item.drink}\n`;
          message += `• Precio: $${item.price} MXN\n\n`;
        });

        const total = cart.reduce((a, b) => a + b.price, 0);

        message += `🛵 *Envío:* ${deliveryType === 'delivery' ? 'GRATIS' : 'N/A'}\n`;
        message += `💰 *TOTAL A PAGAR: $${total} MXN*\n\n`;
        message += "Por favor confirmen mi pedido para realizar el pago. ¡Gracias!";

        const url = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');

        setCart([]);
        setCustomerName('');
        setDeliveryAddress('');
        setIsCartOpen(false);
        showToast('✅ ¡Pedido enviado con éxito!');
      };

      return (
        <div className="min-h-screen flex flex-col md:flex-row relative">
          
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 bg-orange-500 text-white font-bold px-4 py-3 rounded-xl shadow-2xl border border-orange-300 animate-bounce">
              {toastMessage}
            </div>
          )}

          {/* Vista previa izquierda (Solo sticky en móvil, sin alterar la versión web) */}
          <div className="w-full md:w-1/2 min-h-[300px] max-h-[45vh] md:max-h-none md:min-h-[520px] md:h-screen sticky top-0 md:relative z-30 bg-slate-900 flex flex-col items-center justify-center p-4 md:p-12 overflow-y-auto md:overflow-hidden border-b md:border-b-0 md:border-r border-slate-800 shadow-xl md:shadow-none">
            
            <div className="absolute w-[300px] h-[300px] bg-orange-500/20 rounded-full blur-3xl glow-effect pointer-events-none"></div>

            <div className="relative w-full h-full flex flex-col items-center justify-center gap-4 md:gap-6 z-10 my-auto max-w-xl">
              
              <div className="bg-slate-900/90 backdrop-blur-md px-4 py-1.5 md:px-6 md:py-3 rounded-2xl border border-slate-700 text-center shadow-xl flex flex-col items-center gap-1">
                <div className="flex items-center gap-2">
                  <h1 className="text-base md:text-xl font-black text-orange-400">Banderillas</h1>
                  <span className={`inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-full border ${
                    isOpen 
                      ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' 
                      : 'bg-rose-500/20 text-rose-300 border-rose-500/40'
                  }`}>
                    <span className={`w-1.5 h-1.5 rounded-full ${isOpen ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500'}`}></span>
                    {isOpen ? 'Abierto Ahora' : 'Local Cerrado'}
                  </span>
                </div>
                <p className="text-[10px] md:text-xs text-slate-300">Horario: 1:00 PM - 11:00 PM</p>
              </div>

              <div className="relative flex justify-center items-center w-full min-h-[160px] md:min-h-[260px]">
                <div className="absolute top-0 right-2 md:top-2 md:right-4 flex flex-col gap-1.5 z-20 items-end">
                  {selectedBase && selectedBase.badge && (
                    <span className="bg-orange-500 text-white text-[10px] md:text-[11px] font-extrabold px-2.5 py-0.5 md:px-3 md:py-1 rounded-full shadow-lg border border-orange-300">
                      {selectedBase.badge}
                    </span>
                  )}
                  {selectedCoating && selectedCoating.badge && (
                    <span className="bg-amber-400 text-slate-950 text-[10px] md:text-[11px] font-extrabold px-2.5 py-0.5 md:px-3 md:py-1 rounded-full shadow-lg border border-amber-300">
                      {selectedCoating.badge}
                    </span>
                  )}
                </div>

                {selectedCoating ? (
                  <div key={animKey} className="animate-pop relative">
                    <SafeImage 
                      src={selectedCoating.image} 
                      alt={selectedCoating.name}
                      fallbackEmoji="🌭"
                      className="max-h-[160px] md:max-h-[340px] w-auto object-cover rounded-2xl md:rounded-3xl shadow-2xl border-2 border-orange-500/40"
                    />
                  </div>
                ) : (
                  <div className="w-40 h-40 md:w-64 md:h-64 border-2 border-dashed border-slate-700 rounded-2xl md:rounded-3xl flex flex-col items-center justify-center text-center p-4 md:p-6 text-slate-400">
                    <span className="text-3xl md:text-5xl mb-1 md:mb-2 opacity-50">🌭</span>
                    <span className="text-xs font-bold text-slate-300">Arma tu banderilla</span>
                    <span className="text-[10px] mt-1 text-slate-400">Selecciona las opciones abajo</span>
                  </div>
                )}
              </div>

              <div className="w-full flex flex-wrap items-center justify-center gap-2 md:gap-3 z-20 pt-1 md:pt-2">
                {selectedBase ? (
                  <div className="flex items-center gap-2 bg-orange-500/20 border-2 border-orange-500/60 px-3 py-1 md:px-4 md:py-1.5 rounded-xl md:rounded-2xl shadow-xl">
                    <span className="text-sm md:text-base">{selectedBase.icon}</span>
                    <div className="flex flex-col text-left">
                      <span className="text-[9px] md:text-[10px] text-orange-400 font-extrabold uppercase tracking-wider">Relleno Base</span>
                      <span className="text-[11px] md:text-xs font-bold text-white">{selectedBase.name}</span>
                    </div>
                  </div>
                ) : (
                  <span className="text-[10px] md:text-xs text-slate-400 bg-slate-800/80 px-2.5 py-1 md:px-3 md:py-1.5 rounded-xl border border-slate-700">Sin Relleno</span>
                )}

                {selectedSauces.map(sId => {
                  const sData = availableSauces.find(x => x.id === sId);
                  if (!sData) return null;
                  return (
                    <div 
                      key={sId} 
                      className="flex items-center gap-1.5 md:gap-2 bg-slate-900 text-white border border-slate-700 px-3 py-1 md:px-4 md:py-2 rounded-xl md:rounded-2xl shadow-xl"
                    >
                      <SafeImage src={sData.image} alt={sData.name} fallbackEmoji="🥫" className="w-5 h-5 md:w-6 md:h-6 rounded-full object-cover border border-slate-600" />
                      <span className="text-[10px] md:text-xs font-bold">{sData.name}</span>
                    </div>
                  );
                })}

                {selectedDrink && (
                  <div className="flex items-center gap-2 bg-amber-500/20 border-2 border-amber-500/60 px-3 py-1 md:px-4 md:py-1.5 rounded-xl md:rounded-2xl shadow-2xl">
                    <SafeImage 
                      src={selectedDrink.image} 
                      alt={selectedDrink.name} 
                      fallbackEmoji="🥤"
                      className="w-6 h-6 md:w-8 md:h-8 rounded-lg object-cover border border-amber-400/80 shadow-md"
                    />
                    <div className="flex flex-col text-left">
                      <span className="text-[9px] md:text-[10px] text-amber-400 font-extrabold uppercase tracking-wider">Bebida</span>
                      <span className="text-[11px] md:text-xs font-bold text-white">{selectedDrink.name}</span>
                    </div>
                  </div>
                )}
              </div>

            </div>
          </div>

          {/* Panel Lateral */}
          <div className="w-full md:w-1/2 p-6 md:p-10 overflow-y-auto md:max-h-screen bg-slate-950 flex flex-col justify-between">
            <div>
              <div className="mb-6">
                <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2.5">Recetas Firma de la Casa</h3>
                <div className="flex flex-wrap gap-2">
                  {chefPresets.map((preset, idx) => (
                    <button
                      key={idx}
                      onClick={() => applyPreset(preset)}
                      className="bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-700 text-xs px-3 py-1.5 rounded-xl transition font-medium flex items-center gap-1 shadow-sm"
                    >
                      {preset.name}
                    </button>
                  ))}
                </div>
              </div>

              {savedFavorites.length > 0 && (
                <div className="mb-6 bg-slate-900/80 p-3.5 rounded-2xl border border-slate-800">
                  <h3 className="text-xs font-bold text-orange-400 uppercase tracking-wider mb-2">Mis Combinaciones Guardadas</h3>
                  <div className="flex flex-wrap gap-2">
                    {savedFavorites.map(fav => (
                      <button
                        key={fav.id}
                        onClick={() => loadFavorite(fav)}
                        className="bg-orange-500/20 text-orange-300 border border-orange-500/40 text-xs px-3 py-1.5 rounded-xl hover:bg-orange-500/30 transition font-semibold"
                      >
                        ★ {fav.name}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              {/* Opción 1: Relleno Base */}
              <div className="mb-6">
                <h3 className="text-sm font-bold text-orange-400 mb-2.5 flex items-center gap-1.5">
                  <span className="w-5 h-5 bg-orange-500/20 text-orange-400 rounded-full flex items-center justify-center text-xs border border-orange-500/40">1</span>
                  Relleno Base
                </h3>
                <div className="grid grid-cols-1 gap-2">
                  {bases.map(b => {
                    const isSelected = selectedBase?.id === b.id;
                    return (
                      <button
                        key={b.id}
                        onClick={() => handleBaseChange(b)}
                        className={`p-3.5 rounded-xl border text-left flex justify-between items-center transition ${
                          isSelected 
                            ? 'border-orange-500 bg-orange-500/20 text-white shadow-lg font-semibold' 
                            : 'border-slate-800 bg-slate-900/60 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <div className="flex items-center gap-2">
                          <span>{b.icon}</span>
                          <span className="font-medium text-sm">{b.name}</span>
                          {b.badge && <span className="bg-orange-500/30 text-orange-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-orange-500/40">{b.badge}</span>}
                        </div>
                        <span className="font-extrabold text-orange-400 text-sm">${b.price} MXN</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Opción 2: Cobertura Crujiente */}
              <div className="mb-6">
                <h3 className="text-sm font-bold text-orange-400 mb-2.5 flex items-center gap-1.5">
                  <span className="w-5 h-5 bg-orange-500/20 text-orange-400 rounded-full flex items-center justify-center text-xs border border-orange-500/40">2</span>
                  Cobertura Crujiente
                </h3>
                <div className="grid grid-cols-2 gap-2.5">
                  {coatings.map(c => {
                    const isSelected = selectedCoating?.id === c.id;
                    return (
                      <button
                        key={c.id}
                        onClick={() => handleCoatingChange(c)}
                        className={`p-3 rounded-xl border text-left flex flex-col justify-between transition ${
                          isSelected 
                            ? 'border-orange-500 bg-orange-500/20 text-white shadow-lg font-semibold' 
                            : 'border-slate-800 bg-slate-900/60 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <div className="flex flex-col">
                          <span className="font-semibold text-xs text-slate-200">{c.name}</span>
                          <span className="text-[10px] text-orange-400/90 mt-0.5">{c.badge}</span>
                        </div>
                        <span className="text-xs font-bold text-orange-400 mt-2">+{c.price} MXN</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Opción 3: Salsas y Extras */}
              <div className="mb-6">
                <div className="flex justify-between items-center mb-2.5">
                  <h3 className="text-sm font-bold text-orange-400 flex items-center gap-1.5">
                    <span className="w-5 h-5 bg-orange-500/20 text-orange-400 rounded-full flex items-center justify-center text-xs border border-orange-500/40">3</span>
                    Salsas y Extras
                  </h3>
                  <span className="text-[11px] text-slate-400">(Elegidos: {selectedSauces.length})</span>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-2.5">
                  {availableSauces.map(s => {
                    const active = selectedSauces.includes(s.id);
                    return (
                      <button
                        key={s.id}
                        onClick={() => toggleSauce(s.id)}
                        className={`p-2 rounded-xl border flex items-center gap-2.5 transition ${
                          active 
                            ? 'border-orange-500 bg-orange-500/30 text-white font-bold shadow' 
                            : 'border-slate-800 bg-slate-900/60 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <SafeImage 
                          src={s.image} 
                          alt={s.name} 
                          fallbackEmoji="🥫"
                          className="w-8 h-8 rounded-lg object-cover border border-slate-700 flex-shrink-0"
                        />
                        <span className="text-xs font-medium truncate">{active ? '✓ ' : ''}{s.name}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Opción 4: Bebida */}
              <div className="mb-6">
                <h3 className="text-sm font-bold text-orange-400 mb-2.5 flex items-center gap-1.5">
                  <span className="w-5 h-5 bg-orange-500/20 text-orange-400 rounded-full flex items-center justify-center text-xs border border-orange-500/40">4</span>
                  Bebida / Acompañamiento
                </h3>
                <div className="grid grid-cols-2 gap-2.5">
                  {drinks.map(d => {
                    const isSelected = selectedDrink?.id === d.id;
                    return (
                      <button
                        key={d.id}
                        onClick={() => {
                          playSound('click');
                          setSelectedDrink(isSelected ? null : d);
                        }}
                        className={`p-2.5 rounded-xl border text-left text-xs flex items-center gap-3 transition ${
                          isSelected 
                            ? 'border-orange-500 bg-orange-500/20 text-white shadow-lg font-semibold' 
                            : 'border-slate-800 bg-slate-900/60 text-slate-300 hover:border-slate-700'
                        }`}
                      >
                        <SafeImage 
                          src={d.image} 
                          alt={d.name} 
                          fallbackEmoji="🥤"
                          className="w-12 h-12 object-cover rounded-lg border border-slate-700 flex-shrink-0"
                        />
                        <div className="flex flex-col justify-between flex-1 min-w-0">
                          <span className="font-semibold text-slate-200 truncate">{d.name}</span>
                          <span className="font-extrabold text-orange-400 mt-1">${d.price} MXN</span>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="mb-6 flex gap-2">
                <input
                  type="text"
                  placeholder="Guarda este armado (ej. La Consentida)..."
                  value={favoriteName}
                  onChange={(e) => setFavoriteName(e.target.value)}
                  className="bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs flex-1 text-white placeholder-slate-400 focus:outline-none focus:border-orange-500 transition"
                />
                <button
                  onClick={saveFavorite}
                  className="bg-slate-800 hover:bg-slate-700 text-xs font-semibold px-4 py-2 rounded-xl transition border border-slate-700 text-slate-200"
                >
                  ★ Guardar
                </button>
              </div>
            </div>

            <div className="pt-4 border-t border-slate-800 flex items-center justify-between gap-4">
              <div>
                <span className="text-3xl font-black text-orange-400">${currentPrice} MXN</span>
                <span className="text-[11px] text-slate-400 block">Impuestos e ingredientes incluidos</span>
              </div>
              <button
                onClick={addToCart}
                disabled={!isOpen || !selectedBase || !selectedCoating}
                className="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-xl hover:shadow-orange-500/20 transition transform active:scale-95 flex items-center gap-2"
              >
                <span>{!selectedBase || !selectedCoating ? 'Selecciona Opciones' : 'Agregar al Carrito'}</span>
                <span className="bg-white/20 px-2 py-0.5 rounded-lg text-xs">🛒</span>
              </button>
            </div>
          </div>

          {/* Modal Carrito */}
          {isCartOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex justify-end z-50">
              <div className="bg-slate-900 w-full max-w-md h-full max-h-screen p-5 flex flex-col justify-between border-l border-slate-800 shadow-2xl overflow-hidden">
                
                {/* Header del Carrito */}
                <div className="flex-shrink-0 flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                  <div className="flex items-center gap-2">
                    <h3 className="text-xl font-black text-white">Tu Pedido</h3>
                    <span className="bg-orange-500 text-white font-bold text-xs px-2.5 py-0.5 rounded-full">{cart.length}</span>
                  </div>
                  <button onClick={() => { playSound('click'); setIsCartOpen(false); }} className="text-slate-400 hover:text-white text-xl font-bold p-1">✕</button>
                </div>

                {/* Cuerpo desplazable */}
                <div className="flex-1 overflow-y-auto pr-1 space-y-4 min-h-0">
                  <div className="bg-slate-800/90 border border-amber-500/40 p-3 rounded-2xl flex items-center gap-3">
                    <span className="text-2xl">⏱️</span>
                    <div>
                      <span className="text-xs font-bold text-amber-400 block uppercase tracking-wide">Tiempo Estimado</span>
                      <span className="text-sm font-black text-white">
                        {deliveryType === 'delivery' ? '30 - 45 Minutos 🛵' : '15 - 20 Minutos 🏪'}
                      </span>
                    </div>
                  </div>

                  <div className="space-y-3">
                    {cart.length === 0 ? (
                      <p className="text-slate-400 text-center py-8 text-sm">Tu carrito está vacío 🌭</p>
                    ) : (
                      cart.map(item => (
                        <div key={item.id} className="bg-slate-800/90 border border-slate-700 p-3.5 rounded-2xl flex items-center justify-between gap-3">
                          
                          <div className="relative flex-shrink-0">
                            <SafeImage 
                              src={item.image} 
                              alt={item.coating} 
                              fallbackEmoji="🌭"
                              className="w-14 h-14 object-cover rounded-xl border border-slate-600"
                            />
                            {item.drinkImage && (
                              <SafeImage 
                                src={item.drinkImage} 
                                alt={item.drink} 
                                fallbackEmoji="🥤"
                                className="w-6 h-6 object-cover rounded-md border border-amber-400 absolute -bottom-1 -right-1 shadow-md"
                              />
                            )}
                          </div>

                          <div className="flex-1 min-w-0">
                            <div className="font-bold text-sm text-white truncate">{item.base}</div>
                            <div className="text-xs text-orange-400 font-semibold">{item.coating}</div>
                            <div className="text-[11px] text-slate-300 mt-0.5 truncate">Extras/Salsas: {item.sauces}</div>
                            {item.drink && <div className="text-[11px] text-amber-300 mt-0.5 truncate font-medium">🥤 {item.drink}</div>}
                          </div>

                          <div className="flex flex-col items-end justify-between self-stretch">
                            <button 
                              onClick={() => removeFromCart(item.id)}
                              className="text-slate-400 hover:text-red-400 text-sm p-1 transition"
                              title="Eliminar producto"
                            >
                              ✕
                            </button>
                            <div className="font-black text-orange-400 text-sm">${item.price} MXN</div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  {cart.length > 0 && (
                    <div className="space-y-3 bg-slate-950 p-4 rounded-2xl border border-slate-800">
                      <div>
                        <label className="text-xs font-bold text-slate-200 block mb-1.5">Nombre para la entrega:</label>
                        <input 
                          type="text" 
                          placeholder="Escribe tu nombre..." 
                          value={customerName}
                          onChange={(e) => setCustomerName(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500"
                        />
                      </div>

                      <div>
                        <label className="text-xs font-bold text-slate-200 block mb-1.5">Tipo de entrega:</label>
                        <div className="grid grid-cols-2 gap-2">
                          <button
                            onClick={() => { playSound('click'); setDeliveryType('delivery'); }}
                            className={`py-2 rounded-xl text-xs font-bold transition border ${
                              deliveryType === 'delivery' 
                                ? 'bg-orange-500 text-white border-orange-400 shadow' 
                                : 'bg-slate-900 text-slate-300 border-slate-700 hover:border-slate-600'
                            }`}
                          >
                            🛵 A Domicilio
                          </button>
                          <button
                            onClick={() => { playSound('click'); setDeliveryType('pickup'); }}
                            className={`py-2 rounded-xl text-xs font-bold transition border ${
                              deliveryType === 'pickup' 
                                ? 'bg-orange-500 text-white border-orange-400 shadow' 
                                : 'bg-slate-900 text-slate-300 border-slate-700 hover:border-slate-600'
                            }`}
                          >
                            🏪 Recoger en Tienda
                          </button>
                        </div>
                      </div>

                      {deliveryType === 'delivery' && (
                        <div>
                          <label className="text-xs font-bold text-slate-200 block mb-1.5">
                            Dirección de envío <span className="text-orange-400">*</span>
                          </label>
                          <input 
                            type="text" 
                            placeholder="Calle, número, colonia..." 
                            value={deliveryAddress}
                            onChange={(e) => setDeliveryAddress(e.target.value)}
                            className={`w-full bg-slate-900 border rounded-xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 transition ${
                              !deliveryAddress.trim() ? 'border-amber-500/60 focus:border-orange-500 focus:ring-orange-500' : 'border-slate-700 focus:border-orange-500'
                            }`}
                          />
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Pie de Carrito */}
                <div className="flex-shrink-0 pt-3 border-t border-slate-800 mt-2 bg-slate-900">
                  <div className="space-y-1 mb-3">
                    <div className="flex justify-between text-xs text-slate-300">
                      <span>Subtotal:</span>
                      <span className="font-semibold text-white">${cart.reduce((a, b) => a + b.price, 0)} MXN</span>
                    </div>
                    {deliveryType === 'delivery' && (
                      <div className="flex justify-between text-xs text-slate-300">
                        <span>Envío:</span>
                        <span className="text-emerald-400 font-extrabold">¡Gratis!</span>
                      </div>
                    )}
                    <div className="flex justify-between font-black text-lg text-white pt-1.5 border-t border-slate-800">
                      <span>Total Final:</span>
                      <span className="text-orange-400">
                        ${cart.reduce((a, b) => a + b.price, 0)} MXN
                      </span>
                    </div>
                  </div>

                  <button 
                    onClick={checkoutWhatsApp}
                    disabled={cart.length === 0 || !isOpen}
                    className="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] disabled:opacity-50 text-white font-extrabold py-3.5 rounded-2xl transition shadow-xl flex items-center justify-center gap-2 text-sm"
                  >
                    <span>💬 Confirmar Pedido por WhatsApp</span>
                  </button>
                </div>

              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
