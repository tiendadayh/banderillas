<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cocina | Banderillas Coreanas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { heading: ['Poppins', 'sans-serif'], sans: ['Inter', 'sans-serif'] } } } };
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-heading { font-family: 'Poppins', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulseRing { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); } 50% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } }
    .pulse-ring { animation: pulseRing 1.8s infinite; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] overflow-hidden">
  <div id="root" class="h-full"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAuL5YKxucoHUKCkoz5j6m9KU1XjTP0Z2o",
      authDomain: "banderillascoreanas-f9e60.firebaseapp.com",
      databaseURL: "https://banderillascoreanas-f9e60-default-rtdb.firebaseio.com",
      projectId: "banderillascoreanas-f9e60",
      storageBucket: "banderillascoreanas-f9e60.firebasestorage.app",
      messagingSenderId: "30789485951",
      appId: "1:30789485951:web:bb31aec060f17ad6ea864a"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getDatabase(app);
    window.ref = ref;
    window.onValue = onValue;
    window.update = update;
    window.auth = getAuth(app);
    window.onAuthStateChanged = onAuthStateChanged;
    window.signInWithEmailAndPassword = signInWithEmailAndPassword;
  </script>

  <script type="text/javascript">
const { useState, useEffect, useRef } = React;

function useNow(intervalMs) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), intervalMs);
    return () => clearInterval(id);
  }, [intervalMs]);
  return now;
}
function minutesSince(timestamp, now) {
  if (!timestamp) return 0;
  return Math.floor((now - new Date(timestamp).getTime()) / 60000);
}

function LoginScreen() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const handleLogin = async (e) => {
    e.preventDefault();
    setError('');
    if (!email.trim() || !password) { setError('Ingresa correo y contraseña.'); return; }
    setLoading(true);
    try {
      await window.signInWithEmailAndPassword(window.auth, email.trim(), password);
    } catch (err) {
      setError('Correo o contraseña incorrectos.');
    } finally {
      setLoading(false);
    }
  };

  return React.createElement('div', { className: 'h-full w-full flex items-center justify-center bg-slate-950 p-4' },
    React.createElement('form', { onSubmit: handleLogin, className: 'bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm space-y-4' },
      React.createElement('h1', { className: 'font-heading text-lg font-black text-white text-center' }, '🔥 Cocina — Acceso'),
      React.createElement('input', { type: 'email', value: email, onChange: e => setEmail(e.target.value), placeholder: 'Correo', autoFocus: true, className: 'w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white' }),
      React.createElement('input', { type: 'password', value: password, onChange: e => setPassword(e.target.value), placeholder: 'Contraseña', className: 'w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white' }),
      error && React.createElement('p', { className: 'text-xs text-red-400' }, error),
      React.createElement('button', { type: 'submit', disabled: loading, className: 'w-full bg-orange-600 hover:bg-orange-500 disabled:opacity-50 text-white font-extrabold py-2.5 rounded-lg' }, loading ? 'Entrando...' : 'Entrar')
    )
  );
}

function AuthGate() {
  const [user, setUser] = useState(undefined);
  const [role, setRole] = useState(() => localStorage.getItem(ROLE_STORAGE_KEY) || null);
  useEffect(() => {
    const check = setInterval(() => {
      if (window.auth && window.onAuthStateChanged) {
        clearInterval(check);
        window.onAuthStateChanged(window.auth, u => setUser(u || null));
      }
    }, 300);
    return () => clearInterval(check);
  }, []);
  if (user === undefined) return React.createElement('div', { className: 'h-full w-full flex items-center justify-center bg-slate-950 text-slate-500 text-sm' }, 'Cargando...');
  if (user === null) return React.createElement(LoginScreen, null);
  if (!role || !ROLES[role]) {
    return React.createElement(RolePicker, {
      onPick: (r) => { localStorage.setItem(ROLE_STORAGE_KEY, r); setRole(r); }
    });
  }
  return React.createElement(KitchenBoard, {
    role: role,
    onChangeRole: () => { localStorage.removeItem(ROLE_STORAGE_KEY); setRole(null); }
  });
}

const COLUMNS = [
  { id: 'pending', title: 'NUEVOS', emoji: '🆕', color: 'border-yellow-500', headerBg: 'bg-yellow-500/15', textColor: 'text-yellow-300' },
  { id: 'preparing', title: 'PREPARANDO', emoji: '🍳', color: 'border-orange-500', headerBg: 'bg-orange-500/15', textColor: 'text-orange-300' },
  { id: 'shipping', title: 'EN CAMINO / LISTO', emoji: '🛵', color: 'border-blue-500', headerBg: 'bg-blue-500/15', textColor: 'text-blue-300' }
];
const ROLES = {
  cocina: { label: 'Cocina', emoji: '🍳', columnIds: ['pending', 'preparing'], showItems: true, showAddressPhone: false, canAdvance: true },
  reparto: { label: 'Reparto', emoji: '🛵', columnIds: ['shipping'], showItems: false, showAddressPhone: true, canAdvance: false }
};
const NEXT_STATUS = { pending: 'preparing', preparing: 'shipping' };
const ADVANCE_LABEL = { pending: '🍳 Empezar a preparar', preparing: '✅ Listo' };
const ROLE_STORAGE_KEY = 'banderillas_kitchen_role';
const ALERT_MIN = 10;

function RolePicker({ onPick }) {
  return React.createElement('div', { className: 'h-full w-full flex flex-col items-center justify-center bg-slate-950 gap-6 p-6' },
    React.createElement('h1', { className: 'font-heading text-2xl sm:text-3xl font-black text-white text-center' }, '¿Qué vista quieres en esta pantalla?'),
    React.createElement('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-md' },
      Object.entries(ROLES).map(([key, r]) =>
        React.createElement('button', {
          key: key,
          onClick: () => onPick(key),
          className: 'bg-slate-900 border-2 border-slate-700 hover:border-orange-500 rounded-2xl py-8 px-4 flex flex-col items-center gap-2 transition'
        },
          React.createElement('span', { className: 'text-5xl' }, r.emoji),
          React.createElement('span', { className: 'font-heading text-lg font-black text-white' }, r.label)
        )
      )
    ),
    React.createElement('p', { className: 'text-xs text-slate-500 text-center max-w-xs' }, 'Esta pantalla recordará tu elección. Puedes cambiarla luego con el botón "Cambiar vista" en la esquina.')
  );
}

function KitchenBoard({ role, onChangeRole }) {
  const config = ROLES[role];
  const activeColumns = COLUMNS.filter(c => config.columnIds.includes(c.id));
  const [orders, setOrders] = useState([]);
  const now = useNow(20000);
  const audioCtxRef = useRef(null);
  const prevKeysRef = useRef(new Set());
  const firstLoad = useRef(true);
  const wakeLockRef = useRef(null);
  const [wakeLockEnabled, setWakeLockEnabled] = useState(() => localStorage.getItem('banderillas_kitchen_wakelock') === 'true');

  const requestWakeLock = async () => {
    if (!('wakeLock' in navigator)) {
      alert('Este navegador/dispositivo no soporta mantener la pantalla activa.');
      return;
    }
    try {
      wakeLockRef.current = await navigator.wakeLock.request('screen');
      setWakeLockEnabled(true);
    } catch (e) {
      setWakeLockEnabled(false);
    }
  };
  const releaseWakeLock = () => {
    if (wakeLockRef.current) {
      wakeLockRef.current.release().catch(() => {});
      wakeLockRef.current = null;
    }
    setWakeLockEnabled(false);
  };
  useEffect(() => {
    localStorage.setItem('banderillas_kitchen_wakelock', wakeLockEnabled);
  }, [wakeLockEnabled]);
  // El navegador suelta el wake lock solo al minimizar/cambiar de pestaña;
  // lo volvemos a pedir al regresar si se dejó activado.
  useEffect(() => {
    const reacquire = () => {
      if (wakeLockEnabled && document.visibilityState === 'visible' && !wakeLockRef.current && 'wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(s => { wakeLockRef.current = s; }).catch(() => {});
      }
    };
    document.addEventListener('visibilitychange', reacquire);
    return () => document.removeEventListener('visibilitychange', reacquire);
  }, [wakeLockEnabled]);
  useEffect(() => {
    if (wakeLockEnabled) requestWakeLock();
    return () => releaseWakeLock();
  }, []);

  const advanceOrder = (order, fromColId) => {
    const nextStatus = NEXT_STATUS[fromColId];
    if (!nextStatus || !window.db || !window.ref || !window.update || !order.firebaseKey) return;
    const orderRef = window.ref(window.db, `pedidos/${order.firebaseKey}`);
    window.update(orderRef, { status: nextStatus, statusUpdatedAt: new Date().toISOString() });
  };

  const getAudioCtx = () => {
    if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtxRef.current;
  };
  const beep = () => {
    try {
      const ctx = getAudioCtx();
      const fire = () => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start(); osc.stop(ctx.currentTime + 0.3);
      };
      if (ctx.state === 'suspended') ctx.resume().then(fire); else fire();
    } catch (e) {}
  };
  useEffect(() => {
    const unlock = () => { const ctx = getAudioCtx(); if (ctx.state === 'suspended') ctx.resume(); };
    document.addEventListener('touchstart', unlock);
    document.addEventListener('click', unlock);
    return () => { document.removeEventListener('touchstart', unlock); document.removeEventListener('click', unlock); };
  }, []);

  useEffect(() => {
    const check = setInterval(() => {
      if (window.db && window.ref && window.onValue) {
        clearInterval(check);
        const ordersRef = window.ref(window.db, 'pedidos');
        window.onValue(ordersRef, snapshot => {
          const data = snapshot.val();
          const loaded = data ? Object.keys(data).map(k => ({ firebaseKey: k, ...data[k] })) : [];
          const currentKeys = new Set(loaded.map(o => o.firebaseKey));
          const arrived = [...currentKeys].filter(k => !prevKeysRef.current.has(k));
          if (arrived.length > 0 && !firstLoad.current) {
            beep();
            if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
          }
          prevKeysRef.current = currentKeys;
          firstLoad.current = false;
          setOrders(loaded);
        });
      }
    }, 300);
    return () => clearInterval(check);
  }, []);

  return React.createElement('div', { className: 'h-full flex flex-col' },
    React.createElement('header', { className: 'bg-slate-900 border-b border-slate-800 py-3 px-4 flex items-center justify-between shrink-0' },
      React.createElement('h1', { className: 'font-heading text-xl sm:text-2xl font-black text-white' }, `${config.emoji} ${config.label.toUpperCase()} — BANDERILLAS COREANAS`),
      React.createElement('div', { className: 'flex items-center gap-3' },
        React.createElement('span', { className: 'text-sm sm:text-base text-slate-400 font-semibold' }, now && new Date(now).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })),
        React.createElement('button', {
          onClick: () => { wakeLockEnabled ? releaseWakeLock() : requestWakeLock(); },
          className: `flex items-center gap-1 text-[10px] sm:text-xs px-2.5 py-1 rounded-full border whitespace-nowrap transition ${wakeLockEnabled ? 'border-emerald-500 text-emerald-400 bg-emerald-500/10' : 'border-slate-700 text-slate-500'}`
        }, wakeLockEnabled ? '☀️ Pantalla activa' : '🌙 Pantalla libre'),
        React.createElement('button', {
          onClick: onChangeRole,
          className: 'text-[10px] sm:text-xs text-slate-500 hover:text-slate-300 border border-slate-700 rounded-full px-2.5 py-1'
        }, 'Cambiar vista')
      )
    ),
    React.createElement('div', { className: `flex-1 overflow-hidden grid grid-cols-1 ${activeColumns.length > 1 ? 'md:grid-cols-2' : ''} gap-3 p-3` },
      activeColumns.map(col => {
        const colOrders = orders.filter(o => o.status === col.id).sort((a, b) => a.id - b.id);
        return React.createElement('div', { key: col.id, className: `flex flex-col rounded-2xl border-2 ${col.color} ${col.headerBg} overflow-hidden` },
          React.createElement('div', { className: 'py-3 px-4 border-b-2 border-white/10 flex items-center justify-between' },
            React.createElement('h2', { className: `font-heading text-2xl sm:text-3xl font-black ${col.textColor}` }, `${col.emoji} ${col.title}`),
            React.createElement('span', { className: 'bg-black/40 text-white text-xl font-black w-12 h-12 rounded-full flex items-center justify-center' }, colOrders.length)
          ),
          React.createElement('div', { className: 'flex-1 overflow-y-auto no-scrollbar p-3 space-y-3' },
            colOrders.length === 0
              ? React.createElement('div', { className: 'h-full flex items-center justify-center text-slate-600 text-lg sm:text-xl font-bold' }, 'Sin pedidos aquí')
              : colOrders.map(order => {
                const waitMin = minutesSince(order.timestamp, now);
                const delayed = col.id === 'pending' && waitMin >= ALERT_MIN;
                const orderNum = order.orderNumber ? order.orderNumber : (order.id ? String(order.id).slice(-4) : '----');
                return React.createElement('div', {
                  key: order.firebaseKey,
                  className: `bg-slate-900/80 rounded-2xl p-4 border-2 ${delayed ? 'border-red-500 pulse-ring' : 'border-slate-700'}`
                },
                  React.createElement('div', { className: 'flex justify-between items-baseline mb-2' },
                    React.createElement('span', { className: 'font-heading text-2xl sm:text-3xl font-black text-white' }, `#${orderNum}`),
                    React.createElement('span', { className: `text-sm sm:text-base font-bold ${delayed ? 'text-red-400' : 'text-slate-400'}` }, `hace ${waitMin} min`)
                  ),
                  React.createElement('p', { className: 'text-xl sm:text-2xl font-extrabold text-orange-300 mb-3' }, order.customer),
                  config.showItems && React.createElement('div', { className: 'space-y-2' },
                    (order.cart || []).map((item, i) =>
                      React.createElement('div', { key: i, className: 'bg-black/30 rounded-xl p-2.5' },
                        React.createElement('p', { className: 'text-base sm:text-lg font-bold text-white' }, `Orden ${i + 1}: ${item.base}`),
                        React.createElement('ul', { className: 'text-sm sm:text-base text-slate-300 pl-4 list-disc' },
                          (item.coatings || []).map((c, ci) => React.createElement('li', { key: ci }, c.name))
                        ),
                        item.drink && React.createElement('p', { className: 'text-sm sm:text-base text-amber-300 mt-1' }, `🥤 ${item.drink}`)
                      )
                    )
                  ),
                  config.showAddressPhone && React.createElement('div', { className: 'space-y-2' },
                    React.createElement('a', {
                      href: `tel:${order.phone}`,
                      className: 'flex items-center gap-2 text-lg sm:text-xl font-extrabold text-emerald-300'
                    }, '📞 ', order.phone),
                    order.deliveryType === 'delivery'
                      ? React.createElement('p', { className: 'text-base sm:text-lg text-white font-semibold bg-black/30 rounded-xl p-2.5' }, '📍 ', order.address)
                      : React.createElement('p', { className: 'text-base sm:text-lg text-white font-semibold bg-black/30 rounded-xl p-2.5' }, '🏪 Recoger en sucursal'),
                    order.deliveryType === 'delivery' && order.address && React.createElement('a', {
                      href: `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.address)}`,
                      target: '_blank',
                      rel: 'noopener noreferrer',
                      className: 'flex items-center justify-center gap-2 w-full bg-blue-600 hover:bg-blue-500 text-white text-lg sm:text-xl font-black py-3 rounded-xl'
                    }, '🗺️ Abrir en Maps'),
                    React.createElement('p', { className: 'text-base sm:text-lg font-black text-emerald-400' }, '$', order.total, ' MXN')
                  ),
                  React.createElement('p', { className: 'text-xs sm:text-sm text-slate-500 mt-2' },
                    order.deliveryType === 'delivery' ? '🛵 A domicilio' : '🏪 Recoger en sucursal'
                  ),
                  config.canAdvance && React.createElement('button', {
                    onClick: () => advanceOrder(order, col.id),
                    className: 'mt-3 w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white text-lg sm:text-xl font-black py-3 rounded-xl'
                  }, ADVANCE_LABEL[col.id])
                );
              })
          )
        );
      })
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(AuthGate, null));
  </script>
</body>
</html>
